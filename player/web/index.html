<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover: on a phone the page reaches under the notch and the
     home bar, and the canvas is then kept out of them (the insets below).
     No pinch or double-tap zoom: a game's own touches would trigger them. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<!-- Added to an iPhone's home screen, the page opens with no browser around
     it - the only full screen an iPhone gives a web page. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<title>Pyros3D</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    position: fixed; inset: 0; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  /* The canvas is the page, less the parts of a phone's screen a notch or
     the home bar covers. dvh: the height that is actually showing, which on
     a phone changes as the browser's bars come and go. */
  #canvas {
    position: fixed; display: block; outline: none; touch-action: none;
    left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
  .cover {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.9rem; background: #000; color: #e8e8e8; text-align: center;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 1rem; padding: 1.5rem;
  }
  .cover.gone { display: none; }
  #bar { width: min(360px, 60vw); height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: #f0a030; transition: width .15s; }
  #rotate { z-index: 6; font-size: 1.15rem; }
  #rotate svg { width: 72px; height: 72px; }
  #fs, #tip {
    position: fixed; z-index: 5; right: calc(10px + env(safe-area-inset-right, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: #000a; color: #fff; border: 1px solid #fff5; border-radius: 8px;
    font-family: -apple-system, system-ui, sans-serif; font-size: 13px; padding: 8px 12px;
  }
  #fs { cursor: pointer; }
  #fs.gone, #tip.gone { display: none; }
  #tip { left: calc(10px + env(safe-area-inset-left, 0px)); right: auto; max-width: 70vw; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1"></canvas>
  <button id="fs" class="gone" aria-label="Full screen">&#x26F6;</button>
  <div id="tip" class="gone">For full screen: Share, then Add to Home Screen</div>
  <div id="overlay" class="cover"><div id="msg">Loading…</div><div id="bar"><i></i></div></div>
  <div id="rotate" class="cover gone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M2 12a10 10 0 0 0 4 8M22 12a10 10 0 0 0-4-8"/></svg>
    <div>Turn your phone sideways</div>
  </div>
  <script src="./player-shell.js"></script>
  <script src="./PyrosPlayer.js"></script>
</body>
</html>
