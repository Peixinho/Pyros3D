name: Windows

# Every branch - see the note in macos.yml for why. This workflow is the
# reason that note exists: its old branch list did not include the branch the
# editor work was happening on, so nothing here ran for weeks.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the volk pin in cmake/PyrosBackend.cmake (GIT_TAG
  # vulkan-sdk-...): volk.c references entry points declared in the Vulkan
  # headers of its own release, so the SDK must not be older than volk.
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022

    strategy:
      # One link type failing shouldn't hide the state of the other - the
      # point of this workflow is a full picture per push.
      fail-fast: false
      matrix:
        include:
          # Vulkan is the renderer's only GPU API on Windows; the two OpenGL
          # legs went with the OpenGL renderer. Both linkage modes stay,
          # because they fail differently: the DLL is where PYROS3D_API /
          # IMGUI_API export mistakes show up (LNK2019 in a consumer), the
          # static library is where a missing transitive dependency does.
          - name: Vulkan / DLL
            static: "OFF"
            artifact: Pyros3D-windows-vulkan-dll
          - name: Vulkan / static
            static: "ON"
            artifact: Pyros3D-windows-vulkan-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # The LunarG Windows SDK carries the headers the Vulkan device
          # builds against, glslc - which PyrosRenderer.cmake requires to
          # compile resources/shaders to SPIR-V when the engine is built - and
          # glslang's libraries, the optional runtime compiler for materials'
          # surfaces. Building those through vcpkg instead costs ~20 minutes
          # of glslang/SPIRV-Tools compilation per cold cache.
          $ver = $env:VULKAN_SDK_VERSION
          # vulkansdk-windows-X64-<version>.exe, not the pre-1.3.2xx
          # VulkanSDK-<version>-Installer.exe - that name now 404s.
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          $ErrorActionPreference = "Stop"
          # Invoke-WebRequest renders a progress bar per chunk on Windows
          # PowerShell, which dominates the runtime of a ~200MB download.
          $ProgressPreference = "SilentlyContinue"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          $installDir = "C:\VulkanSDK\$ver"
          # Qt Installer Framework flags - the default component set already
          # includes the headers, glslc and glslang.
          $proc = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -Wait -PassThru -ArgumentList `
            "--root", $installDir, `
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          # Without -PassThru + this check a failed install is silent, and
          # only resurfaces as an unrelated-looking find_package(Vulkan) miss.
          if ($proc.ExitCode -ne 0) {
            throw "Vulkan SDK installer exited with $($proc.ExitCode)"
          }
          if (-not (Test-Path "$installDir\Include\vulkan\vulkan.h")) {
            throw "Vulkan SDK installed to $installDir but headers are missing"
          }
          echo "VULKAN_SDK=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$installDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show Vulkan SDK contents
        shell: pwsh
        run: |
          # Cheap insurance: glslc missing fails the configure with a clear
          # message, but glslang missing only drops the runtime compiler
          # silently (PyrosRenderer.cmake treats it as optional). Print the
          # evidence either way.
          $ErrorActionPreference = "Stop"
          & "$env:VULKAN_SDK\Bin\glslc.exe" --version | Select-Object -First 1
          Get-ChildItem "$env:VULKAN_SDK\Lib" -Filter "*.lib" |
            Where-Object { $_.Name -match '^(glslang|MachineIndependent|GenericCodeGen|OSDependent|SPIRV)' } |
            Select-Object Name

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        shell: pwsh
        run: |
          # Deliberately NOT seanmiddleditch/gha-setup-ninja@v5. That action
          # reports success and then intermittently leaves nothing on PATH;
          # when it does, CMake fails two steps later with "unable to find a
          # build program corresponding to Ninja" followed by "CMAKE_C_COMPILER
          # not set", which reads like a broken toolchain or broken code rather
          # than a missing tool. It cost a CI round exactly that way.
          #
          # Visual Studio already ships ninja, so use that and only fall back
          # to a download when it is genuinely absent.
          $ErrorActionPreference = "Stop"

          function Test-Ninja { $null -ne (Get-Command ninja -ErrorAction SilentlyContinue) }

          if (-not (Test-Ninja)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -property installationPath
              $bundled = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
              if (Test-Path (Join-Path $bundled "ninja.exe")) {
                echo $bundled | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
                $env:PATH = "$bundled;$env:PATH"
              }
            }
          }

          if (-not (Test-Ninja)) {
            $zip = "$env:RUNNER_TEMP\ninja.zip"
            $dir = "$env:RUNNER_TEMP\ninja"
            Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            echo $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$dir;$env:PATH"
          }

          # Same reasoning as the Vulkan SDK check above: prove the tool is
          # present here, where the message is unambiguous, rather than letting
          # a later step report a symptom that points somewhere else.
          if (-not (Test-Ninja)) { throw "ninja is still not on PATH after setup" }
          Write-Host "ninja: $((Get-Command ninja).Source)"
          ninja --version

      - name: Configure (vcpkg installs dependencies here)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgToolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          # vcpkg.json at the repo root puts this in manifest mode, so the
          # toolchain builds and installs the dependency set as part of this
          # step - there is no separate install step. The manifest pins Lua
          # to 5.4.8: the current port is 5.5, which sol.hpp does not support
          # and which PyrosDependencies.cmake rejects outright.
          $sdk = $env:VULKAN_SDK.Replace('\', '/')

          # glslang from the SDK. Its libraries there are static, and
          # glslang.lib needs its siblings (MachineIndependent, GenericCodeGen,
          # OSDependent) and the SPIRV-Tools optimizer to link - while
          # PyrosRenderer.cmake only find_library()s glslang.lib itself.
          # Seeding RENDERER_GLSLANG_LIBRARY with the whole set (as a STRING,
          # so find_library leaves it alone) links it without changing the
          # engine's CMake. Only when the header is there too; otherwise the
          # engine builds without the runtime compiler, which is allowed.
          $glslang = @()
          if (Test-Path "$sdk/Include/glslang/Include/glslang_c_interface.h") {
            $libs = @("glslang", "MachineIndependent", "GenericCodeGen", "OSDependent", "SPIRV", "SPIRV-Tools-opt", "SPIRV-Tools") |
              Where-Object { Test-Path "$sdk/Lib/$_.lib" } |
              ForEach-Object { "$sdk/Lib/$_.lib" }
            $glslang = @("-DPYROS_GLSLANG_DIR=$sdk", "-DRENDERER_GLSLANG_LIBRARY:STRING=$($libs -join ';')")
            Write-Host "glslang: $($libs -join ';')"
          } else {
            Write-Warning "glslang headers not in the Vulkan SDK - the engine builds without the runtime GLSL compiler"
          }

          # PYROS_RELOCATABLE_ASSETS makes DemoLauncher and PyrosBuilder
          # resolve their Lua assets relative to the working directory
          # instead of baking in this runner's checkout path - see Package.
          # It is a boolean rather than -DPYROS_ASSET_ROOT=. because a bare
          # "." does not survive PowerShell's native-argument parsing.
          #
          # PYROS_GRAPHICS=Vulkan is the default on Windows; spelled out so
          # the log says what was built. BUILD_VULKAN_BACKEND follows it
          # (PyrosOptions.cmake). HAVE_LUA_BINDINGS is on by default, which
          # DemoLauncher needs.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DCMAKE_PREFIX_PATH=$sdk" `
            -DPYROS_GRAPHICS=Vulkan `
            -DSTATIC_LIB=${{ matrix.static }} `
            @glslang `
            -DBUILD_DEMOS=ON `
            -DBUILD_EDITOR=ON `
            -DBUILD_CONVERTER=ON `
            -DPYROS_RELOCATABLE_ASSETS=ON 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
          # The Vulkan SDK not found only WARNs, and the engine then
          # configures with no renderer at all. Fail here, where the cause is
          # legible.
          $line = Select-String -Path configure.log -Pattern "Renderer: on \(Vulkan" | Select-Object -First 1
          if (-not $line) { throw "the renderer is not on Vulkan - see the Renderer: line in the configure output" }
          Write-Host $line.Line

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: CPU tests
        # Windows ran no tests at all. It built every configuration and
        # packaged it, and every assertion this repo has was checked
        # on Linux or macOS - which is exactly backwards for the
        # platform whose distinctive failure is an uninitialised member
        # that reads as NULL under one compiler and garbage under
        # another.
        #
        # One leg only: this is CPU code and MSVC is MSVC whichever
        # backend the engine was built against. The DLL leg rather than
        # the static one because linking against the import library
        # needs nothing but PyrosEngine.lib, while a static libary
        # would drag in every vcpkg dependency by hand.
        #
        # _IMPORT is what turns PYROS3D_API into dllimport for a
        # consumer - see include/Pyros3D/Other/Export.h. Without it the
        # macro is empty and class data symbols do not resolve.
        #
        # Built by hand rather than through CMake, matching every other
        # binary in tools/tests.
        if: matrix.name == 'Vulkan / DLL'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inc = "build\vcpkg_installed\x64-windows\include"
          # The DLL lives next to its import library; the tests load it
          # at startup.
          $env:PATH = "$PWD\build;$env:PATH"
          $tests = @(
            "brdf_lut", "sh_irradiance", "octahedral", "probe_grid",
            "bvh", "ddgi", "ddgi_specular", "ray_scene_moving",
            "static_registration", "child_registration"
          )
          foreach ($t in $tests) {
            Write-Host "--- $t ---"
            cl /nologo /std:c++17 /EHsc /O2 /D_IMPORT `
              /I include /I $inc `
              tools\tests\$t.cpp `
              /Fe:"$env:TEMP\$t.exe" /Fo:"$env:TEMP\" `
              /link /LIBPATH:build PyrosEngine.lib
            if ($LASTEXITCODE -ne 0) { throw "$t failed to build" }
            & "$env:TEMP\$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }
          # Streaming, terrain, foliage and networking: these include
          # Box3D's headers (physics components) and need the engine's
          # PUBLIC PYROS_NETWORKING define repeated.
          $tests2 = @(
            "asset_streamer", "world_streamer", "heightfield", "foliage",
            "paintable_image", "net_transport", "net_session", "net_join",
            "net_crypto", "net_rendezvous"
          )
          foreach ($t in $tests2) {
            Write-Host "--- $t ---"
            cl /nologo /std:c++17 /EHsc /O2 /D_IMPORT /DPYROS_NETWORKING `
              /I include /I $inc /I src\Pyros3D\Ext\box3d\include /I src\Pyros3D\Network `
              tools\tests\$t.cpp `
              /Fe:"$env:TEMP\$t.exe" /Fo:"$env:TEMP\" `
              /link /LIBPATH:build PyrosEngine.lib
            if ($LASTEXITCODE -ne 0) { throw "$t failed to build" }
            & "$env:TEMP\$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "package"
          $sym = "symbols"
          # DemoLauncher and PyrosBuilder each want their own "assets"
          # directory (examples/assets vs editor/assets) at the working
          # directory, so they cannot share one folder.
          New-Item -ItemType Directory -Force -Path "$out\demolauncher" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out\editor"       | Out-Null
          New-Item -ItemType Directory -Force -Path "$out\lib"          | Out-Null

          # --- engine library + import lib / static lib -------------------
          Copy-Item "build\*.dll" "$out\lib" -ErrorAction SilentlyContinue
          Copy-Item "build\*.lib" "$out\lib" -ErrorAction SilentlyContinue
          # A STATIC PyrosEngine.lib does not absorb its dependencies, so
          # anything linking it needs box3d and volk alongside.
          # They land in two different places: box3d under
          # build\_deps\box3d\src\, but volk under .fetchcontent-cache\,
          # because box3d's own CMakeLists points FETCHCONTENT_BASE_DIR at
          # the source tree so downloads survive a clean rebuild - and that
          # applies to every FetchContent after it, volk included. Everything
          # else the engine links (freetype, lua, glslang) comes from vcpkg or
          # the SDK, which a consumer supplies itself.
          @("build\_deps", ".fetchcontent-cache") | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem -Path $_ -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName "$out\lib" -Force }
            }
          }

          # --- DemoLauncher ----------------------------------------------
          # No shaders\ beside either executable any more: the renderer's
          # shaders are compiled to SPIR-V at build time and embedded in the
          # engine library.
          Copy-Item "build\examples\DemoLauncher.exe" "$out\demolauncher"
          Copy-Item "build\examples\*.dll"            "$out\demolauncher" -ErrorAction SilentlyContinue
          Copy-Item "examples\assets"                 "$out\demolauncher\assets" -Recurse

          # --- PyrosBuilder ----------------------------------------------
          Copy-Item "build\editor\PyrosBuilder.exe" "$out\editor"
          # editor/CMakeLists.txt copies AssimpImporter next to PyrosBuilder
          # so Import Model can shell out to it - keep them together here too.
          Copy-Item "build\editor\AssimpImporter.exe" "$out\editor"
          # vcpkg's applocal deployment runs per-executable, so assimp's DLL
          # landed next to AssimpImporter's *own* build output - PyrosBuilder
          # does not link assimp and so never had it copied into build\editor.
          Copy-Item "build\tools\AssimpImporter\*.dll" "$out\editor" -ErrorAction SilentlyContinue
          Copy-Item "build\editor\*.dll"            "$out\editor" -ErrorAction SilentlyContinue
          # The game runtime - see the Linux workflow's note. Its DLLs are
          # copied at the end of this step, once the editor's are all in.
          New-Item -ItemType Directory -Force -Path "$out\player" | Out-Null
          Copy-Item "build\player\PyrosPlayer.exe" "$out\player"
          Copy-Item "build\player\PyrosServer.exe" "$out\player"
          Copy-Item "build\player\*.dll"           "$out\player" -ErrorAction SilentlyContinue
          # AMD's FSR 3.1 upscaler for Vulkan: AMD's own signed build of it, from
          # the last FidelityFX SDK with a Vulkan backend (1.1.4, MIT). The
          # engine looks for it beside the program and offers "fsr3" when it is
          # there; without it nothing is lost but that choice.
          try {
            Invoke-WebRequest -Uri "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/raw/v1.1.4/PrebuiltSignedDLL/amd_fidelityfx_vk.dll" -OutFile "$out\player\amd_fidelityfx_vk.dll"
            Copy-Item "$out\player\amd_fidelityfx_vk.dll" "$out\editor"
            Write-Host "FSR 3.1: $((Get-Item "$out\player\amd_fidelityfx_vk.dll").Length) bytes"
          } catch { Write-Warning "FSR 3.1 library not fetched: $_" }
          Copy-Item "editor\assets"                 "$out\editor\assets" -Recurse
          # Editor.cpp loads "<PYROS_ASSET_ROOT>/assets/middleclass.lua", and
          # with PYROS_ASSET_ROOT=. that resolves into the editor's own
          # assets folder - which is not where middleclass.lua lives.
          Copy-Item "examples\assets\middleclass.lua" "$out\editor\assets"

          # PyrosEngine.dll is emitted at the build root, not next to either
          # executable (single Ninja output dir per target directory).
          if ("${{ matrix.static }}" -eq "OFF") {
            Copy-Item "build\PyrosEngine.dll" "$out\demolauncher"
            Copy-Item "build\PyrosEngine.dll" "$out\editor"
          }

          # vcpkg's applocal deployment walks each executable's own import
          # table, and in a SHARED build the executables import PyrosEngine.dll
          # rather than freetype/png/brotli/bz2/z directly - those are linked
          # into the engine. applocal will not introspect PyrosEngine.dll,
          # because it is our build output rather than a vcpkg DLL, so that
          # whole chain went missing and the .exe died on startup with
          # "freetype.dll not found". Copy vcpkg's runtime DLLs wholesale
          # instead of relying on applocal having found the right ones.
          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" "$out\demolauncher" -Force
            Copy-Item "$vcpkgBin\*.dll" "$out\editor"       -Force
          }

          # The MSVC C++ runtime (VCRUNTIME140, VCRUNTIME140_1, MSVCP140) is
          # NOT part of Windows - it ships in the Visual C++ Redistributable,
          # which a clean machine does not have, and every executable here
          # imports it. Only the api-ms-win-crt-* forwarders and ucrtbase are
          # OS components. Microsoft supports app-local deployment, so ship it
          # and let the artifact run on a machine with nothing installed.
          $redist = Get-ChildItem "$env:VCToolsRedistDir\x64" -Filter "Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $redist) {
            throw "Could not locate the MSVC redistributable under $env:VCToolsRedistDir\x64"
          }
          Write-Host "Bundling MSVC runtime from $($redist.FullName)"
          Copy-Item "$($redist.FullName)\*.dll" "$out\demolauncher" -Force
          Copy-Item "$($redist.FullName)\*.dll" "$out\editor"       -Force

          # Symbols go to their own artifact, mirroring the package layout so
          # they can be dropped straight back in. They tripled the download
          # (55MB -> 150MB) and most people never need them - but the crash
          # handler resolves names from a .pdb sitting next to the .exe, so
          # anyone chasing a crash wants them merged back over the package.
          New-Item -ItemType Directory -Force -Path "$sym\demolauncher" | Out-Null
          New-Item -ItemType Directory -Force -Path "$sym\editor"       | Out-Null
          New-Item -ItemType Directory -Force -Path "$sym\lib"          | Out-Null
          Copy-Item "build\examples\*.pdb" "$sym\demolauncher" -Force -ErrorAction SilentlyContinue
          Copy-Item "build\editor\*.pdb"   "$sym\editor"       -Force -ErrorAction SilentlyContinue
          Copy-Item "build\*.pdb"           "$sym\lib"          -Force -ErrorAction SilentlyContinue
          if ("${{ matrix.static }}" -eq "OFF") {
            Copy-Item "build\PyrosEngine.pdb" "$sym\demolauncher" -Force -ErrorAction SilentlyContinue
            Copy-Item "build\PyrosEngine.pdb" "$sym\editor"       -Force -ErrorAction SilentlyContinue
          }

          # (No shaderc_shared.dll any more: nothing compiles the renderer's
          # shaders at run time, and glslang, when present, is linked
          # statically into the engine.)

          # The player's DLLs, last: by now the editor's folder holds the
          # engine, vcpkg's runtime and the MSVC runtime - a superset of what
          # the player and the server import.
          Copy-Item "$out\editor\*.dll" "$out\player" -Force -ErrorAction SilentlyContinue

          # Both executables resolve "assets/..." against the working
          # directory, so they have to be started from their own folder.
          # Worth saying so in the artifact rather than letting it present as
          # a missing-asset error.
          @(
            "Pyros3D - Windows ${{ matrix.name }}",
            "",
            "  demolauncher\  DemoLauncher.exe",
            "  editor\        PyrosBuilder.exe, AssimpImporter.exe",
            "  lib\           engine library + import/static libs",
            "",
            "Run each executable from inside its own folder - both load",
            "assets\ relative to the current directory:",
            "",
            "    cd demolauncher",
            "    .\DemoLauncher.exe",
            "",
            "The two folders are separate because ''assets'' means",
            "examples\assets to DemoLauncher and editor\assets to PyrosBuilder.",
            "",
            "PyrosBuilder is a windowed application and opens no console of",
            "its own. Started from a command prompt it still prints there;",
            "double-clicked, it prints nowhere - so start it from a prompt",
            "when you want to see what it is doing.",
            "",
            "If it crashes it prints a stack trace, and also writes it to",
            "PyrosCrash.txt beside the .exe - which is the copy to send when",
            "there was no console to read. To get names and line numbers in",
            "it, download the matching -symbols artifact and copy its folders",
            "over this one, so each .pdb sits beside its .exe; without them",
            "the trace has module+offset and no function names at all.",
            "",
            "For more detail, raise the log level first:",
            "",
            "    set PYROS_LOG_LEVEL=3",
            "    .\DemoLauncher.exe",
            "",
            "0=errors only, 1=+warnings (default), 2=+success, 3=everything.",
            "",
            "Drawing needs a Vulkan driver (vulkan-1.dll comes with it)."
          ) | Out-File -FilePath "$out\README.txt" -Encoding utf8

          # Binaries only - the assets trees would bury the log.
          Get-ChildItem -Recurse $out -Include *.exe, *.dll, *.lib |
            Select-Object @{n="File";e={$_.FullName.Replace("$pwd\\","")}}, Length |
            Format-Table -AutoSize

      # Compile+link success says nothing about whether the packaged folder
      # actually has everything it needs at runtime - the SHARED build
      # shipped without freetype.dll and died on startup while CI stayed
      # green. Walk each executable's import graph and fail here instead.
      - name: Verify dependency closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dumpbin = (Get-ChildItem "$env:VCToolsInstallDir\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $dumpbin) { $dumpbin = "dumpbin.exe" }

          # Genuinely OS-provided only. The MSVC runtime (vcruntime140,
          # msvcp140) is deliberately NOT here: it comes from the Visual C++
          # Redistributable, not Windows, so it has to be bundled and this
          # check should fail if it is not. api-ms-win-crt-* and ucrtbase are
          # the Universal CRT, which is part of Windows 10/11.
          $systemOk = '^(api-ms-win-|ext-ms-win-|kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|comdlg32|winmm|ws2_32|opengl32|glu32|imm32|version|setupapi|cfgmgr32|crypt32|bcrypt|ncrypt|secur32|iphlpapi|dbghelp|shlwapi|rpcrt4|msvcrt|ucrtbase|dwmapi|uxtheme|hid|wldap32|normaliz|d3d\d+|dxgi|vulkan-1|mfplat|mf|winhttp|dnsapi|powrprof)'

          $failed = $false
          foreach ($dir in @("package\demolauncher", "package\editor", "package\player")) {
            $present = @{}
            Get-ChildItem "$dir\*.dll" -ErrorAction SilentlyContinue | ForEach-Object { $present[$_.Name.ToLower()] = $true }

            $queue = [System.Collections.Queue]::new()
            Get-ChildItem "$dir\*.exe" | ForEach-Object { $queue.Enqueue($_.FullName) }
            Get-ChildItem "$dir\*.dll" -ErrorAction SilentlyContinue | ForEach-Object { $queue.Enqueue($_.FullName) }
            $seen = @{}

            while ($queue.Count -gt 0) {
              $bin = $queue.Dequeue()
              if ($seen[$bin]) { continue }
              $seen[$bin] = $true
              $deps = & $dumpbin /dependents $bin 2>$null |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { $_.Matches[0].Groups[1].Value }
              foreach ($d in $deps) {
                $dl = $d.ToLower()
                if ($dl -match $systemOk) { continue }
                if ($present[$dl]) { continue }
                Write-Host "::error::$dir - $(Split-Path $bin -Leaf) needs $d, which is not in the package"
                $failed = $true
              }
            }
            Write-Host "$dir - checked $($seen.Count) binaries against $($present.Count) bundled DLLs"
          }
          if ($failed) { throw "Packaged binaries have unresolved DLL dependencies" }

      # Not merely diagnostic: a clean non-zero exit is fine here (no GPU on
      # a runner), but an unhandled exception is a real defect. Every crash
      # that shipped with CI green - null glad pointer, null volk pointer,
      # volk vs vulkan-1 symbol clash - did so because nothing checked how
      # the process died. The point is also to capture what the binary
      # prints on startup (the engine logs through echo() to the console by
      # default), so a startup failure is visible in CI rather than only on
      # a user's desktop.
      #
      # One exception: a runner has no Vulkan driver, so usually no device
      # can be made at all - and DemoLauncher::Init then goes on to use the
      # null device and takes an access violation. That is a defect in
      # DemoLauncher, not in the package (it had loaded every DLL and opened
      # its window to get that far), so it is reported as a warning when the
      # log says no device could be made, and as a failure otherwise.
      - name: Smoke run
        shell: pwsh
        run: |
          $dir = "$pwd\package\demolauncher"
          $exe = "$dir\DemoLauncher.exe"
          # Its first demo, input dropped, fixed clock - the switches
          # tools/VisualCheck runs it with. PYROS_SHOT writes the 60th
          # presented frame, should a device come up.
          $env:PYROS_DEMO_INDEX = "0"
          $env:PYROS_DEMO_NO_UI = "1"
          $env:PYROS_DEMO_FIXED_CLOCK = "1"
          $env:PYROS_SHOT = "$pwd\smoke-shot.png"
          $env:PYROS_SHOT_FRAME = "60"
          Write-Host "--- launching $exe from $dir ---"
          # An exit code of -1073741819 (0xC0000005, access violation) with
          # empty stdout/stderr says only "it crashed before it logged
          # anything". Run it under cdb when the SDK debugger is on the
          # image, so we get the faulting frame instead.
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($cdb) {
            Write-Host "--- running under $($cdb.FullName) ---"
            # Commands run at the initial breakpoint: g continues to the
            # fault, then .lastevent/!analyze/kb describe it. No -g, which
            # would skip past that breakpoint and the -c list with it.
            # Push-Location because the app resolves assets\ against the
            # working directory, and cdb inherits ours.
            Push-Location $dir
            & $cdb.FullName -G -c '.symfix; .reload; g; .lastevent; !analyze -v; kb; q' $exe 2>&1 |
              Select-Object -First 200
            Pop-Location
          } else {
            Write-Host "--- cdb not on this image, exit code only ---"
          }

          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru `
                 -RedirectStandardOutput "$pwd\smoke-out.txt" `
                 -RedirectStandardError  "$pwd\smoke-err.txt"
          $crashed = $false
          if ($p.WaitForExit(25000)) {
            $code = $p.ExitCode
            Write-Host "--- exited on its own with code $code ---"
            # Every Windows termination via an unhandled exception reports an
            # NTSTATUS, which is negative as a signed exit code (0xC0000005
            # access violation = -1073741819). A deliberate exit(EXIT_FAILURE)
            # is 1. So: negative means it crashed, positive means it failed
            # cleanly and said why - and only the former is a bug here, since
            # a runner has no GPU and is *expected* to fail.
            # (no Vulkan device on the runner is the expected case: DemoLauncher
            # says so and exits 1 - only a crash is a bug)
            if ($code -lt 0) {
              Write-Host ("::error::DemoLauncher terminated on an unhandled exception (0x{0:X8}) instead of reporting a failure. See the stack above." -f $code)
              $crashed = $true
            }
          } else {
            # Still running after 25s is the good outcome: it got a window up
            # and stayed in its loop.
            Write-Host "--- still running after 25s, killing ---"
            $p.Kill()
          }
          Write-Host "--- stdout ---"
          Get-Content "$pwd\smoke-out.txt" -ErrorAction SilentlyContinue | Select-Object -First 60
          Write-Host "--- stderr ---"
          Get-Content "$pwd\smoke-err.txt" -ErrorAction SilentlyContinue | Select-Object -First 60
          if (Test-Path "$pwd\smoke-shot.png") { Write-Host "--- frame captured: $((Get-Item "$pwd\smoke-shot.png").Length) bytes ---" }
          if ($crashed) { exit 1 }
          exit 0

      - name: Packaged runtime starts
        # What Build Game copies into every game (and what other platforms
        # use as their Windows template) must run from its own folder.
        # --print-key makes the server key and exits before any scene.
        shell: pwsh
        run: |
          $g = Join-Path $env:RUNNER_TEMP "template-check"
          New-Item -ItemType Directory -Force -Path "$g\scenes" | Out-Null
          Set-Content -Path "$g\game.json" -Value '{"startupScene":"scenes/S.json"}'
          & "package\player\PyrosServer.exe" --game $g --print-key
          if ($LASTEXITCODE -ne 0) { throw "PyrosServer exited with $LASTEXITCODE" }
          if (-not (Test-Path "$g\server.key")) { throw "no server.key was written" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: symbols/
          if-no-files-found: error
