name: macOS

# Every branch, deliberately. The four platform workflows used to carry three
# different branch lists between them, so a feature branch built on none of
# them - 47 commits once reached master carrying an MSVC error that only a
# shared Windows build could see, because no Windows build had ever run on the
# branch it was written on. Minutes are free on a public repo; a break found
# three weeks later is not.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # arm64. Apple Silicon is what the engine is developed on, and the
    # framework/linker issues this workflow exists to catch are arm64-specific.
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Metal
            graphics: Metal
            context: Auto
            metal: "ON"
            vulkan: "OFF"
            compute: metal
            package: "yes"
            artifact: Pyros3D-macos-metal
          - name: OpenGL
            graphics: OpenGL
            context: SDL2
            metal: "OFF"
            vulkan: "OFF"
            # GL on macOS caps at 4.1 and compute is 4.3, so there is
            # nothing to run here - see tools/tests/compute_smoke.cpp.
            compute: none
            package: "yes"
            artifact: Pyros3D-macos-opengl
          # Builds and links, but ships nothing. A redistributable Vulkan
          # package on macOS is a different problem from the other two: volk
          # dlopen()s the loader, and the loader then needs MoltenVK's ICD
          # manifest found through VK_ICD_FILENAMES - so the folder only works
          # behind a launcher script that sets it. Metal is the native path
          # anyone would actually ship here. This leg is for compile/link
          # coverage of the Vulkan backend on Apple, which is where the
          # breakage actually happens.
          - name: Vulkan (MoltenVK)
            graphics: Vulkan
            context: SDL2Vulkan
            metal: "OFF"
            vulkan: "ON"
            compute: vulkan
            package: "no"
            artifact: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # --quiet, and no `brew update`: the runner image is already current,
          # and a full update costs minutes for nothing.
          # lua@5.4, not lua: the unversioned formula is 5.5 now, which
          # sol.hpp does not support and PyrosDependencies.cmake looks past -
          # it probes `brew --prefix lua@5.4` by name.
          brew install --quiet ninja sdl2 freetype lua@5.4 shaderc spirv-cross assimp
          if [ "${{ matrix.vulkan }}" = "ON" ]; then
            # Homebrew rather than the LunarG .dmg: find_package(Vulkan) only
            # needs headers + loader, both of which brew has, and the installer
            # costs ~10 minutes per run. molten-vk supplies the ICD that turns
            # Vulkan calls into Metal ones.
            brew install --quiet molten-vk vulkan-loader vulkan-headers
          fi

      - name: Configure
        run: |
          EXTRA=""
          if [ "${{ matrix.vulkan }}" = "ON" ]; then
            # FindVulkan checks $VULKAN_SDK before system paths, and the brew
            # prefix has the include/ and lib/ layout it expects.
            export VULKAN_SDK="$(brew --prefix)"
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          fi
          # STATIC_LIB=OFF on purpose: a shared build is the one that exercises
          # symbol visibility and install names, which is where the
          # platform-specific defects live. The static path is covered on
          # Windows and Linux.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYROS_GRAPHICS=${{ matrix.graphics }} \
            -DCONTEXT=${{ matrix.context }} \
            -DOPENGL_VERSION=GL41 \
            -DSTATIC_LIB=OFF \
            -DBUILD_METAL_BACKEND=${{ matrix.metal }} \
            -DBUILD_VULKAN_BACKEND=${{ matrix.vulkan }} \
            -DBUILD_SPIRV_TOOLING=ON \
            -DBUILD_DEMOS=ON \
            -DBUILD_EDITOR=ON \
            -DBUILD_CONVERTER=ON \
            -DPYROS_RELOCATABLE_ASSETS=ON \
            $EXTRA

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Compute, GI and particle tests
        if: matrix.compute != 'none'
        # The macOS runners are the only CI machines with a real GPU, and
        # Metal and MoltenVK are the only backends whose compute path
        # cannot be exercised anywhere else - Linux covers GL via llvmpipe,
        # and the web target has no compute stage at all. Without this step
        # nothing would catch a regression in either until someone ran the
        # test by hand.
        #
        # Built by hand rather than through CMake, matching every other
        # binary in tools/tests (none are in the build system - see the
        # compile line in each file's header comment).
        run: |
          set -euo pipefail
          FT="$(pkg-config --cflags freetype2)"
          # Hoisted rather than set inside the first Vulkan branch that
          # needs them: three separate if/else blocks below use these, and
          # relying on an earlier branch having run is the kind of
          # ordering dependency that breaks the moment someone reorders
          # the tests. FetchContent puts them in the build tree, not on
          # any install prefix.
          VMA="$(find . -name vk_mem_alloc.h -print -quit)"
          VOLK="$(find . -name volk.h -print -quit)"
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -DMETAL_BACKEND -DCOMPUTE_SMOKE_METAL \
              -I include $FT \
              tools/tests/compute_smoke.cpp -o /tmp/compute_smoke \
              -L build -lPyrosEngine \
              -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            # No SDL at all - the Vulkan leg runs headless via
            # InitializeHeadless().
            c++ -std=c++17 -DVULKAN_BACKEND -DCOMPUTE_SMOKE_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/compute_smoke.cpp -o /tmp/compute_smoke \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
            # volk dlopen()s the loader, so it has to be findable, and the
            # loader needs MoltenVK's ICD manifest pointed at explicitly -
            # the same reason this matrix entry ships no package (see its
            # comment above).
            export VK_ICD_FILENAMES="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
            export DYLD_LIBRARY_PATH="$(brew --prefix)/lib:${DYLD_LIBRARY_PATH:-}"
          fi
          set +e
          /tmp/compute_smoke | tee /tmp/compute_out.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "--- exit code $code ---"
          if [ $code -ne 0 ]; then
            echo "::error::compute_smoke failed on ${{ matrix.compute }}"
            exit 1
          fi
          # A SKIP exits 0 by design so the test is safe to run anywhere,
          # but on a runner that is supposed to have this backend a skip
          # means the coverage silently evaporated. Fail loudly instead.
          if grep -q '^SKIP' /tmp/compute_out.txt; then
            echo "::error::compute_smoke SKIPped on ${{ matrix.compute }} - the backend reported no compute support"
            exit 1
          fi
          grep -q '^PASS  compute_smoke' /tmp/compute_out.txt

          # SH irradiance: pure CPU maths, checked against closed forms
          # and brute-force integration. Cheap, and the failure mode it
          # guards is ambient light that is quietly the wrong colour.
          c++ -std=c++17 -I include tools/tests/sh_irradiance.cpp \
            src/Pyros3D/Rendering/GI/SphericalHarmonics.cpp \
            src/Pyros3D/Core/Math/Vec3.cpp -o /tmp/sh_irradiance
          /tmp/sh_irradiance

          # Probe grid interpolation. Also CPU-only, and also guarding a
          # failure that looks like plausible lighting rather than an error.
          c++ -std=c++17 -I include tools/tests/probe_grid.cpp \
            src/Pyros3D/Rendering/GI/IrradianceProbeGrid.cpp \
            src/Pyros3D/Rendering/GI/SphericalHarmonics.cpp \
            src/Pyros3D/Core/Math/Vec3.cpp -o /tmp/probe_grid
          /tmp/probe_grid

          # BVH traversal against a brute-force scan. CPU-only, and the
          # failure it guards is speckled noise or light through walls -
          # both of which get blamed on the GI algorithm, not the tree.
          c++ -std=c++17 -I include $FT tools/tests/bvh.cpp -o /tmp/bvh \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/bvh

          # Octahedral encoding and the bordered probe atlas. CPU-only.
          # The border rule is the one no texture wrap mode implements,
          # and getting it wrong filters across the seam into unrelated
          # directions - which reads as probe density, not a bug.
          c++ -std=c++17 -I include $FT tools/tests/octahedral.cpp -o /tmp/octahedral \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/octahedral

          # The Cornell box: colour bleeding and leak rejection. CPU-only
          # and the slowest of these, but it is the test that decides
          # whether any of the GI work is real - a white light must leave
          # a red tint on a white floor beside a red wall, and a sealed
          # box must not light its own outside.
          c++ -std=c++17 -O2 -I include $FT tools/tests/ddgi.cpp -o /tmp/ddgi \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/ddgi

          # And that PyrosShader.glsl's SHIrradiance still agrees with the
          # C++ one. Reads the shader file and runs it through compute, so
          # it needs a backend that has compute - which is exactly the
          # legs this step runs on.
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -DMETAL_BACKEND -DPARITY_METAL -I include $FT \
              tools/tests/sh_shader_parity.cpp -o /tmp/sh_parity \
              -L build -lPyrosEngine -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            c++ -std=c++17 -DVULKAN_BACKEND -DPARITY_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/sh_shader_parity.cpp -o /tmp/sh_parity \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          fi
          # Run from the repo root - it reads resources/shaders/.
          /tmp/sh_parity | tee /tmp/parity_out.txt
          grep -q '^PASS  sh_shader_parity' /tmp/parity_out.txt

          # GPU particle simulation against the CPU integrator it
          # replaces. Same two-backend build shape as sh_parity above.
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -DMETAL_BACKEND -DPARITY_METAL -I include $FT \
              tools/tests/particles_gpu_parity.cpp -o /tmp/particles_parity \
              -L build -lPyrosEngine -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            c++ -std=c++17 -DVULKAN_BACKEND -DPARITY_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/particles_gpu_parity.cpp -o /tmp/particles_parity \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          fi
          /tmp/particles_parity | tee /tmp/particles_out.txt
          grep -q '^PASS  particles_gpu_parity' /tmp/particles_out.txt

          # The BVH traversal kernel against the CPU intersector. Closes
          # the chain: brute force -> CPU BVH -> GPU kernel, all on the
          # same rays.
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -DMETAL_BACKEND -DRTPARITY_METAL -I include $FT \
              tools/tests/bvh_gpu.cpp -o /tmp/bvh_gpu \
              -L build -lPyrosEngine -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            c++ -std=c++17 -DVULKAN_BACKEND -DRTPARITY_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/bvh_gpu.cpp -o /tmp/bvh_gpu \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          fi
          # Run from the repo root - it reads resources/shaders/gi/.
          /tmp/bvh_gpu | tee /tmp/bvhgpu_out.txt
          grep -q '^PASS  bvh_gpu' /tmp/bvhgpu_out.txt

          # The DDGI compute port against the CPU volume it replaces -
          # every interior texel of every probe, both atlases.
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -DMETAL_BACKEND -DDDGIGPU_METAL -I include $FT \
              tools/tests/ddgi_gpu.cpp -o /tmp/ddgi_gpu \
              -L build -lPyrosEngine -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            c++ -std=c++17 -DVULKAN_BACKEND -DDDGIGPU_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/ddgi_gpu.cpp -o /tmp/ddgi_gpu \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          fi
          /tmp/ddgi_gpu | tee /tmp/ddgigpu_out.txt
          grep -q '^PASS  ddgi_gpu' /tmp/ddgigpu_out.txt

          # A baked environment must survive save/load. Pure CPU, and the
          # failure it guards is silent data loss rather than a crash.
          c++ -std=c++17 -DLUA_BINDINGS -I include -I shared $FT \
            -I "$(brew --prefix lua@5.4)/include/lua" \
            tools/tests/sh_scene_roundtrip.cpp -o /tmp/sh_roundtrip \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/sh_roundtrip | tee /tmp/roundtrip_out.txt
          grep -q '^PASS  sh_roundtrip' /tmp/roundtrip_out.txt

          # The specular sampler in PyrosShader.glsl against
          # DDGIVolume::SampleRadiance, by reading the shipped GLSL and
          # running it - the same trick sh_shader_parity uses, and it
          # needs compute for the same reason.
          #
          # What it guards is not the lighting maths but the ATLAS
          # ARITHMETIC: the radiance atlas stacks every probe at
          # roughness level 0, then every probe at level 1, and a wrong
          # stride still produces a perfectly plausible reflection of
          # the wrong part of the room. It also carries probe
          # relocation offsets, so it catches a shader that samples a
          # probe where it no longer is.
          if [ "${{ matrix.compute }}" = "metal" ]; then
            c++ -std=c++17 -O2 -DMETAL_BACKEND -DPARITY_METAL -I include $FT \
              tools/tests/ddgi_specular_shader_parity.cpp -o /tmp/ddgi_sp \
              -L build -lPyrosEngine -framework Foundation -framework Metal \
              -Wl,-rpath,"$PWD/build"
          else
            c++ -std=c++17 -O2 -DVULKAN_BACKEND -DPARITY_VULKAN \
              -I include -I "$(brew --prefix)/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/ddgi_specular_shader_parity.cpp -o /tmp/ddgi_sp \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          fi
          # Run from the repo root - it reads resources/shaders/.
          /tmp/ddgi_sp | tee /tmp/ddgisp_out.txt
          grep -q '^PASS  ddgi_specular_shader_parity' /tmp/ddgisp_out.txt

      - name: Package
        if: matrix.package == 'yes'
        run: |
          set -euo pipefail
          out=package
          # Same split as the Windows workflow, for the same reason: "assets"
          # means examples/assets to DemoLauncher and editor/assets to
          # PyrosBuilder, so they cannot share one directory.
          mkdir -p "$out/demolauncher" "$out/editor" "$out/lib"

          cp build/libPyrosEngine*.dylib "$out/lib" 2>/dev/null || true

          cp build/examples/DemoLauncher "$out/demolauncher"
          cp build/examples/CppApiDemo   "$out/demolauncher"
          cp -R examples/assets          "$out/demolauncher/assets"
          cp -R resources/shaders        "$out/demolauncher/shaders"

          cp build/editor/PyrosBuilder   "$out/editor"
          # Import Model shells out to AssimpImporter and expects it alongside.
          cp build/editor/AssimpImporter "$out/editor"
          cp -R editor/assets            "$out/editor/assets"
          cp -R resources/shaders        "$out/editor/shaders"
          # Editor.cpp loads <asset root>/assets/middleclass.lua, and with
          # relocatable assets that resolves into the editor's own assets
          # folder - which is not where middleclass.lua is kept.
          cp examples/assets/middleclass.lua "$out/editor/assets/"

          # The engine dylib has to sit beside each executable, not in lib/ -
          # bundle-macos.sh rewrites load commands to @executable_path.
          cp build/libPyrosEngine*.dylib "$out/demolauncher" 2>/dev/null || true
          cp build/libPyrosEngine*.dylib "$out/editor"       2>/dev/null || true

      - name: Bundle dependencies
        if: matrix.package == 'yes'
        # Copies every Homebrew dylib in and repoints the load commands at the
        # copies, then fails if anything still references the build machine.
        run: |
          chmod +x .github/scripts/bundle-macos.sh
          ./.github/scripts/bundle-macos.sh package/demolauncher package/editor

      - name: Smoke run
        if: matrix.package == 'yes'
        # Proves the bundled folder starts on its own. Not a rendering test: a
        # clean non-zero exit is an acceptable outcome, since the runner's GPU
        # and display situation is not a user's. What is NOT acceptable is
        # death by signal - that means the package is broken, and it is exactly
        # how a missing dylib or an invalidated code signature presents.
        run: |
          cd package/demolauncher
          set +e
          ./CppApiDemo > out.txt 2> err.txt &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 20s, which is the good outcome ---"
            kill $pid
            code=0
          else
            wait $pid
            code=$?
            echo "--- exited on its own with code $code ---"
          fi
          echo "--- stdout ---"; head -60 out.txt
          echo "--- stderr ---"; head -60 err.txt
          # 128+N means terminated by signal N: 139 = SIGSEGV, 134 = SIGABRT.
          if [ $code -ge 128 ]; then
            echo "::error::CppApiDemo was killed by signal $((code - 128)) - the package is broken, not merely unable to render"
            exit 1
          fi
          exit 0

      - name: Upload artifact
        if: matrix.package == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
