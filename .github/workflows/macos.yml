name: macOS

# Every branch, deliberately. The four platform workflows used to carry three
# different branch lists between them, so a feature branch built on none of
# them - 47 commits once reached master carrying an MSVC error that only a
# shared Windows build could see, because no Windows build had ever run on the
# branch it was written on. Minutes are free on a public repo; a break found
# three weeks later is not.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # arm64. Apple Silicon is what the engine is developed on, and the
    # framework/linker issues this workflow exists to catch are arm64-specific.
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          # The native path, and the one that ships. The renderer's shaders
          # are SPIR-V compiled at build time (glslc) and turned into MSL by
          # SPIRV-Cross when a pipeline is made.
          - name: Metal
            graphics: Metal
            tests: "yes"
            package: "yes"
            artifact: Pyros3D-macos-metal
          # Builds and links, but ships nothing. A redistributable Vulkan
          # package on macOS is a different problem from Metal: volk
          # dlopen()s the loader, and the loader then needs MoltenVK's ICD
          # manifest found through VK_ICD_FILENAMES - so the folder only works
          # behind a launcher script that sets it. Metal is the native path
          # anyone would actually ship here. This leg is for compile/link
          # coverage of the Vulkan device (VulkanDevice.cpp) on Apple, where
          # it is built against MoltenVK's CAMetalLayer surface rather than
          # the Win32/Xlib ones the other two workflows cover.
          - name: Vulkan (MoltenVK)
            graphics: Vulkan
            tests: "no"
            package: "no"
            artifact: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # --quiet, and no `brew update`: the runner image is already current,
          # and a full update costs minutes for nothing.
          # lua@5.4, not lua: the unversioned formula is 5.5 now, which
          # sol.hpp does not support and PyrosDependencies.cmake looks past -
          # it probes `brew --prefix lua@5.4` by name.
          #
          # shaderc for glslc, which is not optional: PyrosRenderer.cmake
          # compiles resources/shaders to SPIR-V when the engine is built
          # (find_program(glslc REQUIRED)) and embeds the result. glslang is
          # the runtime GLSL compiler for materials' surfaces; it is optional
          # (without it surfaces come from the surface cache), but it is one
          # formula and shaderc depends on it anyway, so it is named here
          # rather than left to arrive by accident. spirv-cross is what the
          # Metal device turns that SPIR-V into MSL with.
          brew install --quiet ninja sdl2 freetype lua@5.4 shaderc glslang spirv-cross assimp
          if [ "${{ matrix.graphics }}" = "Vulkan" ]; then
            # Homebrew rather than the LunarG .dmg: find_package(Vulkan) only
            # needs headers + loader, both of which brew has, and the installer
            # costs ~10 minutes per run. molten-vk supplies the ICD that turns
            # Vulkan calls into Metal ones.
            brew install --quiet molten-vk vulkan-loader vulkan-headers
          fi
          glslc --version | head -1

      - name: Configure
        run: |
          set -o pipefail
          EXTRA=""
          if [ "${{ matrix.graphics }}" = "Vulkan" ]; then
            # FindVulkan checks $VULKAN_SDK before system paths, and the brew
            # prefix has the include/ and lib/ layout it expects.
            export VULKAN_SDK="$(brew --prefix)"
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          fi
          # STATIC_LIB=OFF on purpose: a shared build is the one that exercises
          # symbol visibility and install names, which is where the
          # platform-specific defects live. The static path is covered on
          # Windows.
          #
          # PYROS_GRAPHICS alone picks the device: BUILD_METAL_BACKEND and
          # BUILD_VULKAN_BACKEND default to whatever it names
          # (PyrosOptions.cmake), so passing them as well would only be a
          # second place to get it wrong. HAVE_LUA_BINDINGS is on by default,
          # which is what DemoLauncher needs to be built at all.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYROS_GRAPHICS=${{ matrix.graphics }} \
            -DSTATIC_LIB=OFF \
            -DBUILD_DEMOS=ON \
            -DBUILD_EDITOR=ON \
            -DBUILD_CONVERTER=ON \
            -DPYROS_RELOCATABLE_ASSETS=ON \
            $EXTRA | tee configure.log
          # A device that was asked for but not found (no spirv-cross, no
          # Vulkan headers) only WARNs, and the engine then configures with
          # no renderer at all. Fail here, where the cause is legible.
          grep -q "Renderer: on (${{ matrix.graphics }}" configure.log || {
            echo "::error::the renderer is not on ${{ matrix.graphics }} - see the Renderer: line above"
            exit 1
          }
          grep "Renderer: on" configure.log

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: CPU tests (GI maths, scene round-trip)
        if: matrix.tests == 'yes'
        # These used to share a step with the GPU parity tests (compute_smoke,
        # sh_shader_parity, bvh_gpu, ddgi_gpu, the particle and DDGI-specular
        # parity), which ran compute kernels through the old renderer's
        # devices. Those devices and those tests are gone with it; what is
        # left here is CPU-only and backend-independent, so it runs on one
        # leg. The rest of tools/tests runs on Linux and Windows.
        #
        # Built by hand rather than through CMake, matching every other
        # binary in tools/tests (none are in the build system - see the
        # compile line in each file's header comment).
        run: |
          set -euo pipefail
          FT="$(pkg-config --cflags freetype2)"

          # SH irradiance: pure CPU maths, checked against closed forms
          # and brute-force integration. Cheap, and the failure mode it
          # guards is ambient light that is quietly the wrong colour.
          c++ -std=c++17 -I include tools/tests/sh_irradiance.cpp \
            src/Pyros3D/Rendering/GI/SphericalHarmonics.cpp \
            src/Pyros3D/Core/Math/Vec3.cpp -o /tmp/sh_irradiance
          /tmp/sh_irradiance

          # Probe grid interpolation. Also CPU-only, and also guarding a
          # failure that looks like plausible lighting rather than an error.
          c++ -std=c++17 -I include tools/tests/probe_grid.cpp \
            src/Pyros3D/Rendering/GI/IrradianceProbeGrid.cpp \
            src/Pyros3D/Rendering/GI/SphericalHarmonics.cpp \
            src/Pyros3D/Core/Math/Vec3.cpp -o /tmp/probe_grid
          /tmp/probe_grid

          # BVH traversal against a brute-force scan. The failure it guards
          # is speckled noise or light through walls - both of which get
          # blamed on the GI algorithm, not the tree.
          c++ -std=c++17 -I include $FT tools/tests/bvh.cpp -o /tmp/bvh \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/bvh

          # Octahedral encoding and the bordered probe atlas. The border
          # rule is the one no texture wrap mode implements, and getting it
          # wrong filters across the seam into unrelated directions - which
          # reads as probe density, not a bug.
          c++ -std=c++17 -I include $FT tools/tests/octahedral.cpp -o /tmp/octahedral \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/octahedral

          # The Cornell box: colour bleeding and leak rejection. The slowest
          # of these, but it is the test that decides whether any of the GI
          # work is real - a white light must leave a red tint on a white
          # floor beside a red wall, and a sealed box must not light its own
          # outside.
          c++ -std=c++17 -O2 -I include $FT tools/tests/ddgi.cpp -o /tmp/ddgi \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/ddgi

          # A baked environment must survive save/load. The failure it
          # guards is silent data loss rather than a crash.
          c++ -std=c++17 -DLUA_BINDINGS -I include -I shared $FT \
            -I "$(brew --prefix lua@5.4)/include/lua" \
            tools/tests/sh_scene_roundtrip.cpp -o /tmp/sh_roundtrip \
            -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
          /tmp/sh_roundtrip | tee /tmp/roundtrip_out.txt
          grep -q '^PASS  sh_roundtrip' /tmp/roundtrip_out.txt

      - name: Package
        if: matrix.package == 'yes'
        run: |
          set -euo pipefail
          out=package
          # Same split as the Windows workflow, for the same reason: "assets"
          # means examples/assets to DemoLauncher and editor/assets to
          # PyrosBuilder, so they cannot share one directory.
          mkdir -p "$out/demolauncher" "$out/editor" "$out/lib"

          cp build/libPyrosEngine*.dylib "$out/lib" 2>/dev/null || true

          # No shaders/ beside either executable any more: the renderer's
          # shaders are compiled to SPIR-V at build time and embedded in the
          # engine library.
          cp build/examples/DemoLauncher "$out/demolauncher"
          cp -R examples/assets          "$out/demolauncher/assets"

          cp build/editor/PyrosBuilder   "$out/editor"
          # The game runtime: what Build Game ships, here so a downloaded
          # editor can build a game at all - and so another platform's
          # editor can use this folder as its template for this one
          # (tools/fetch_templates.sh).
          mkdir -p "$out/player"
          cp build/player/PyrosPlayer build/player/PyrosServer "$out/player"
          cp build/libPyrosEngine*.dylib "$out/player" 2>/dev/null || true
          # Import Model shells out to AssimpImporter and expects it alongside.
          cp build/editor/AssimpImporter "$out/editor"
          cp -R editor/assets            "$out/editor/assets"
          # Editor.cpp loads <asset root>/assets/middleclass.lua, and with
          # relocatable assets that resolves into the editor's own assets
          # folder - which is not where middleclass.lua is kept.
          cp examples/assets/middleclass.lua "$out/editor/assets/"

          # The engine dylib has to sit beside each executable, not in lib/ -
          # bundle-macos.sh rewrites load commands to @executable_path.
          cp build/libPyrosEngine*.dylib "$out/demolauncher" 2>/dev/null || true
          cp build/libPyrosEngine*.dylib "$out/editor"       2>/dev/null || true

      - name: Bundle dependencies
        if: matrix.package == 'yes'
        # Copies every Homebrew dylib in and repoints the load commands at the
        # copies, then fails if anything still references the build machine.
        run: |
          chmod +x .github/scripts/bundle-macos.sh
          ./.github/scripts/bundle-macos.sh package/demolauncher package/editor package/player
          # The packaged runtime must start from its own folder, with only
          # what was bundled beside it: it is what Build Game copies into
          # every game, on this platform and - as a template - on others.
          # --print-key makes the server key and exits before any scene.
          mkdir -p /tmp/template-check/scenes
          echo '{"startupScene":"scenes/S.json"}' > /tmp/template-check/game.json
          package/player/PyrosServer --game /tmp/template-check --print-key
          test -s /tmp/template-check/server.key

      - name: Smoke run
        if: matrix.package == 'yes'
        # Proves the bundled folder starts on its own. Not a rendering test: a
        # clean non-zero exit is an acceptable outcome, since the runner's GPU
        # and display situation is not a user's. What is NOT acceptable is
        # death by signal - that means the package is broken, and it is exactly
        # how a missing dylib or an invalidated code signature presents.
        #
        # DemoLauncher, on its first demo, with input dropped and a fixed
        # clock (the same switches tools/VisualCheck runs it with). The Metal
        # device writes the 60th presented frame to PYROS_SHOT, which is kept
        # as an artifact: whether the runner's paravirtual GPU drew anything
        # is then something a human can look at, not something guessed.
        #
        # One exception to "signal = broken": when no device could be made
        # at all, DemoLauncher::Init goes on to use the null device and
        # crashes. That is a defect in DemoLauncher, not in the package (it
        # had already loaded every dylib and opened its window to get that
        # far), so it is reported as a warning rather than failing the job.
        run: |
          shot="$PWD/smoke-shot.png"
          cd package/demolauncher
          set +e
          PYROS_DEMO_INDEX=0 PYROS_DEMO_NO_UI=1 PYROS_DEMO_FIXED_CLOCK=1 \
            PYROS_SHOT="$shot" PYROS_SHOT_FRAME=60 \
            ./DemoLauncher > out.txt 2> err.txt &
          pid=$!
          sleep 30
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 30s, which is the good outcome ---"
            kill $pid
            code=0
          else
            wait $pid
            code=$?
            echo "--- exited on its own with code $code ---"
          fi
          echo "--- stdout ---"; head -60 out.txt
          echo "--- stderr ---"; head -60 err.txt
          if [ -s "$shot" ]; then
            echo "--- frame captured: $(wc -c < "$shot") bytes ---"
          else
            echo "::warning::DemoLauncher wrote no PYROS_SHOT frame - the device may not have come up on this runner"
          fi
          # 128+N means terminated by signal N: 139 = SIGSEGV, 134 = SIGABRT.
          if [ $code -ge 128 ]; then
            echo "::error::DemoLauncher was killed by signal $((code - 128)) - the package is broken, not merely unable to render"
            exit 1
          fi
          exit 0

      - name: Upload the smoke-run frame
        if: matrix.package == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-smoke-frame
          path: smoke-shot.png
          if-no-files-found: ignore

      - name: Upload artifact
        if: matrix.package == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
