name: Linux

# Every branch - see the note in macos.yml for why.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Built inside 22.04, not on the 24.04 runner, purely to lower the glibc
    # floor. glibc is forward- but not backward-compatible, so whatever the
    # build machine has becomes the minimum for everyone running the artifact,
    # and on 24.04 that was 2.38 - which locks out Ubuntu 22.04 LTS, Debian 12
    # and RHEL 9, all still widely deployed.
    #
    # Nothing in this engine needs a modern glibc. Measured against the 24.04
    # artifact, the entire 2.38 requirement came from __isoc23_sscanf /
    # __isoc23_strtol (glibc's own headers redirecting plain sscanf/strtol to
    # C23 variants) and a re-versioned fmodf. The floor was an accident of the
    # image, so the fix belongs here rather than in the code.
    #
    # 22.04 rather than something older: below glibc 2.28 the job cannot run at
    # all, because actions/checkout executes Node inside this container.
    container: ubuntu:22.04

    # A container job does not get the runner's default shell: GitHub falls
    # back to `sh -e {0}`, and dash is not bash. `set -o pipefail` is the first
    # thing that breaks on, after the build has already succeeded. Naming bash
    # once here is better than per-step, since every step below assumes it.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenGL
            graphics: OpenGL
            context: SDL2
            vulkan: "OFF"
            opengl: GL41
            compute: "OFF"
            artifact: Pyros3D-linux-opengl
          - name: Vulkan
            graphics: Vulkan
            context: SDL2Vulkan
            vulkan: "ON"
            opengl: GL41
            # No compute here, and not for want of a device: this leg
            # configures with BUILD_SPIRV_TOOLING=OFF (see the Configure
            # step for why), which means CompileShaderStage cannot
            # produce a module for ANY stage on any backend. Vulkan on
            # Linux is compile/link coverage, not a working renderer, so
            # SupportsCompute() correctly reports false here.
            #
            # Vulkan compute IS covered - on macOS, against MoltenVK,
            # where SPIRV_TOOLING is on. Tried lavapipe here first; the
            # SKIP-is-a-failure guard below caught it immediately, which
            # is the guard doing its job.
            compute: "OFF"
            artifact: Pyros3D-linux-vulkan
          # The only job in the whole CI matrix that can actually RUN a
          # compute shader. Compute is GL 4.3, and of the platforms this
          # project builds for, Linux is the one where that is reachable
          # without a GPU: Mesa's llvmpipe implements GL 4.5 in software,
          # so a headless container gets real dispatches, real SSBO
          # writes and a real readback to verify.
          #
          # macOS cannot host this at any speed (Apple caps OpenGL at
          # 4.1), and the web target never will (WebGL2 has no compute
          # stage). So if this job does not exercise the GL compute path,
          # nothing does - see tools/tests/compute_smoke.cpp.
          - name: OpenGL GL45 (compute)
            graphics: OpenGL
            context: SDL2
            vulkan: "OFF"
            opengl: GL45
            compute: "gl"
            artifact: Pyros3D-linux-opengl-gl45

    steps:
      # Before checkout, not after: actions/checkout needs git present to clone
      # submodules, and silently falls back to a submodule-less REST download
      # when it is missing - which then fails much later as a missing box2d.
      # A bare ubuntu image has neither git nor certificates.
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils sudo

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        # No sudo: a container job runs as root. It is installed above anyway,
        # because some actions expect it to exist.
        #
        # libcurl is not optional despite being "just" the AI Assistant's HTTP
        # transport: editor/CMakeLists.txt does find_package(CURL REQUIRED) and
        # fails configuration outright without it. macOS has it in /usr/lib and
        # Windows gets it from vcpkg, so Linux is the only platform that has to
        # ask - and the old workflow never noticed, because it never built the
        # editor at all.
        run: |
          apt-get install -y --no-install-recommends \
            build-essential ninja-build patchelf pkg-config file \
            libsdl2-dev \
            libfreetype-dev \
            liblua5.4-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libassimp-dev \
            libcurl4-openssl-dev

      - name: Install CMake
        # Jammy ships exactly 3.22.1 and the project asks for 3.22, which is a
        # hair's width to build on. Take the official binary release instead:
        # one URL, no third-party apt repo, same version the runner image would
        # have given us.
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local
          cmake --version

      - name: Install Vulkan headers
        if: matrix.vulkan == 'ON'
        # Jammy's libvulkan-dev is 1.3.204, and volk is pinned to
        # vulkan-sdk-1.4.357.0 in PyrosBackend.cmake. volk.c references entry
        # points declared in the headers of its own release, so headers older
        # than volk do not compile - the same coupling windows.yml calls out.
        #
        # Only the headers need to be current. The loader comes from apt and,
        # at runtime, from the user's system: volk dlopen()s it rather than
        # linking it, which is why the backend wants Vulkan::Headers and not
        # Vulkan::Vulkan.
        run: |
          apt-get install -y --no-install-recommends libvulkan-dev
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 \
            https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build \
            -DCMAKE_INSTALL_PREFIX=/opt/vulkan >/dev/null
          cmake --build /tmp/vulkan-headers/build --target install >/dev/null
          # FindVulkan looks under $VULKAN_SDK for include/ AND lib/, so point
          # lib/ at the loader apt just installed rather than leaving it empty.
          mkdir -p /opt/vulkan/lib
          ln -sf /usr/lib/x86_64-linux-gnu/libvulkan.so.1 /opt/vulkan/lib/libvulkan.so
          echo "VULKAN_SDK=/opt/vulkan" >> "$GITHUB_ENV"
          grep -m1 VK_HEADER_VERSION_COMPLETE /opt/vulkan/include/vulkan/vulkan_core.h

      - name: Configure
        # BUILD_EDITOR and BUILD_CONVERTER are new here. The old Build workflow
        # compiled the library and the demos only, so every editor-only source
        # file - which is most of what changes week to week - was unbuilt on
        # Linux entirely.
        #
        # BUILD_SPIRV_TOOLING=OFF: Ubuntu's shaderc/spirv-cross packaging is
        # the one combination PyrosBackend.cmake warns about (a thin
        # libshaderc_combined.a that still needs glslang at link time), and it
        # degrades to a warning rather than an error, which would leave a
        # silently tool-less build here. Windows and macOS both cover it.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYROS_GRAPHICS=${{ matrix.graphics }} \
            -DCONTEXT=${{ matrix.context }} \
            -DOPENGL_VERSION=${{ matrix.opengl }} \
            -DSTATIC_LIB=OFF \
            -DBUILD_VULKAN_BACKEND=${{ matrix.vulkan }} \
            ${VULKAN_SDK:+-DCMAKE_PREFIX_PATH=$VULKAN_SDK} \
            -DBUILD_SPIRV_TOOLING=OFF \
            -DBUILD_DEMOS=ON \
            -DBUILD_EDITOR=ON \
            -DBUILD_CONVERTER=ON \
            -DPYROS_RELOCATABLE_ASSETS=ON \
            -DLUA_INCLUDE_DIR=/usr/include/lua5.4 \
            -DLUA_LIBRARY=/usr/lib/x86_64-linux-gnu/liblua5.4.so

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: CPU tests
        # Everything in tools/tests that needs no GPU. They run HERE
        # rather than on macOS because this is the cheapest runner and
        # because none of them care what backend the library was built
        # with - the GPU-bound tests are on macOS, which is the only CI
        # machine with a real device.
        #
        # One matrix leg only: the same CPU code three times over
        # teaches nothing.
        #
        # Built by hand, matching every other binary in tools/tests
        # (none are in the build system - see the compile line in each
        # file's header comment). Each returns non-zero on failure, so
        # `set -e` is the whole check.
        #
        # Until this step existed, eleven of these ran nowhere at all:
        # they were written, they passed on the author's machine, and
        # CI never saw them again.
        if: matrix.name == 'OpenGL'
        run: |
          set -euo pipefail
          FT="$(pkg-config --cflags freetype2)"
          # Split, and the order matters: GNU ld resolves left to
          # right, so a -l that appears BEFORE the object needing it
          # contributes nothing and the link fails on undefined
          # symbols. macOS's linker does not care, which is exactly how
          # a one-line build command that works on the author's machine
          # gets committed and breaks here.
          CF="-std=c++17 -O2 -I include $FT"
          LD="-L build -lPyrosEngine -Wl,-rpath,$PWD/build"

          # --- GI maths, CPU side -------------------------------------
          # The environment BRDF table, against the integral it
          # approximates and against the analytic fit it replaced.
          c++ $CF tools/tests/brdf_lut.cpp -o /tmp/brdf_lut $LD
          /tmp/brdf_lut
          # Specular GI: directionality, roughness response, and that a
          # reflection obeys the same wall a diffuse bounce does.
          c++ $CF tools/tests/ddgi_specular.cpp -o /tmp/ddgi_specular $LD
          /tmp/ddgi_specular

          # --- scene, tiles, UI ---------------------------------------
          c++ $CF tools/tests/child_registration.cpp -o /tmp/child_registration $LD
          /tmp/child_registration
          # Static objects must all be live after ONE update. They were
          # not: the loop that moves them off the pending list erased
          # and incremented, so it took three frames to register six
          # objects - invisible in a running scene, fatal to anything
          # that reads the scene once at load time.
          c++ $CF tools/tests/static_registration.cpp -o /tmp/static_registration $LD
          /tmp/static_registration
          # Moving geometry: that the triangles follow an object and
          # that the BVH follows the triangles. The second fails
          # silently - a stale tree still returns hits, just against
          # bounds nothing is inside any more.
          c++ $CF tools/tests/ray_scene_moving.cpp -o /tmp/ray_scene_moving $LD
          /tmp/ray_scene_moving
          c++ $CF tools/tests/tilemap_colliders.cpp -o /tmp/tilemap_colliders $LD
          /tmp/tilemap_colliders
          c++ $CF tools/tests/tilemap_mesh.cpp -o /tmp/tilemap_mesh $LD
          /tmp/tilemap_mesh
          c++ $CF tools/tests/tileset_uv.cpp -o /tmp/tileset_uv $LD
          /tmp/tileset_uv
          c++ $CF tools/tests/ui_layout.cpp -o /tmp/ui_layout $LD
          /tmp/ui_layout
          c++ $CF tools/tests/ui_widgets.cpp -o /tmp/ui_widgets $LD
          /tmp/ui_widgets

          # Box3D's own headers are not on the include path the engine
          # installs.
          c++ $CF -I src/Pyros3D/Ext/box3d/include \
            tools/tests/physics_unregistered_body.cpp -o /tmp/physics_unregistered_body $LD
          /tmp/physics_unregistered_body

          # These two reach into shared/, which the editor and the
          # player both compile but the library does not export.
          c++ $CF -I shared tools/tests/prefab_roundtrip.cpp -o /tmp/prefab_roundtrip $LD
          # Wants a project-shaped directory to round-trip through, and
          # takes its root as an argument.
          mkdir -p /tmp/prefabproj/assets/prefabs /tmp/prefabproj/scenes
          (cd /tmp/prefabproj && /tmp/prefab_roundtrip .)

          # The same Lua the Configure step pointed CMake at - not
          # whatever `pkg-config lua` resolves to, which on this image
          # is a different major version and fails inside sol2 with a
          # wall of template errors.
          c++ $CF -DLUA_BINDINGS -I shared -I /usr/include/lua5.4 \
            tools/tests/ui_dispatch.cpp -o /tmp/ui_dispatch $LD -llua5.4
          /tmp/ui_dispatch

      - name: Package
        run: |
          set -euo pipefail
          out=package
          mkdir -p "$out/demolauncher" "$out/editor" "$out/lib"

          cp build/libPyrosEngine*.so* "$out/lib" 2>/dev/null || true

          cp build/examples/DemoLauncher "$out/demolauncher"
          cp build/examples/CppApiDemo   "$out/demolauncher"
          cp -R examples/assets          "$out/demolauncher/assets"
          cp -R resources/shaders        "$out/demolauncher/shaders"

          cp build/editor/PyrosBuilder   "$out/editor"
          cp build/editor/AssimpImporter "$out/editor"
          cp -R editor/assets            "$out/editor/assets"
          cp -R resources/shaders        "$out/editor/shaders"
          cp examples/assets/middleclass.lua "$out/editor/assets/"

          cp build/libPyrosEngine*.so* "$out/demolauncher" 2>/dev/null || true
          cp build/libPyrosEngine*.so* "$out/editor"       2>/dev/null || true

          cat > "$out/README.txt" <<'EOF'
          Pyros3D - Linux

            demolauncher/  DemoLauncher, CppApiDemo
            editor/        PyrosBuilder, AssimpImporter
            lib/           engine shared library

          Run each executable from inside its own folder - both resolve
          assets/ and shaders/ against the current directory:

              cd demolauncher
              ./DemoLauncher

          The bundled libraries (SDL2, freetype, lua, ...) sit next to the
          executables and are found through an $ORIGIN RUNPATH, so nothing
          needs installing for them. What is NOT bundled, deliberately, is
          anything tied to your machine: the GL/Vulkan driver, X11/Wayland,
          and the C library. Those must come from your system, which means:

            - GLIBC_FLOOR_PLACEHOLDER
            - a working OpenGL or Vulkan driver
            - X11 or Wayland client libraries

          Raise the log level with PYROS_LOG_LEVEL=3 for detail
          (0=errors, 1=+warnings, 2=+success, 3=everything).
          EOF

      - name: Bundle dependencies
        run: |
          chmod +x .github/scripts/bundle-linux.sh
          ./.github/scripts/bundle-linux.sh package/demolauncher package/editor

      - name: Record the glibc floor
        # The minimum glibc is a measured property of the binaries, not a fact
        # about the build image, and the two are not the same: building in
        # 22.04 (glibc 2.35) produced binaries that only ever ask for 2.34,
        # because nothing here references a 2.35-only symbol. Writing the
        # measurement into the README keeps the claim true when the image, the
        # compiler or the dependency set changes - a hardcoded number silently
        # becomes a lie and turns away users who could have run it.
        run: |
          floor=$(find package -type f \( -perm -u+x -o -name '*.so*' \) -exec sh -c \
              'file -b "$1" | grep -q "^ELF" && readelf -V "$1" 2>/dev/null' _ {} \; \
              | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -u -V | tail -1)
          if [ -z "$floor" ]; then
            echo "::error::could not determine the glibc floor from the package"
            exit 1
          fi
          echo "measured glibc floor: $floor"
          sed -i "s/- GLIBC_FLOOR_PLACEHOLDER/- ${floor/GLIBC_/glibc } or newer (measured from the binaries)/" package/README.txt
          grep glibc package/README.txt

      - name: Compute smoke test
        if: matrix.compute != 'OFF'
        # Built by hand rather than through CMake, matching every other
        # binary in tools/tests (none of them are in the build system -
        # see the compile line in each file's header comment). Kept that
        # way deliberately here too: this links against the GL45 build
        # tree specifically, which is one matrix entry out of three, and
        # wiring a conditional target into the root CMakeLists for it
        # would cost more than the two commands below.
        #
        # GL: LIBGL_ALWAYS_SOFTWARE forces llvmpipe rather than whatever
        # stub the container might otherwise pick. Without it a runner
        # with no DRI device can land on a GL 1.4 software path, where
        # the test correctly reports SKIP.
        #
        # Only the GL45 leg reaches here today - see the Vulkan entry in
        # the matrix for why that backend is covered on macOS instead.
        # The Vulkan branch below is kept because it is correct and costs
        # nothing, and becomes live the moment a Linux leg builds with
        # SPIRV_TOOLING on.
        #
        # A SKIP means the coverage silently evaporated, so the step
        # turns that into a hard failure on purpose.
        run: |
          set -euo pipefail
          FT="$(pkg-config --cflags freetype2)"
          if [ "${{ matrix.compute }}" = "gl" ]; then
            apt-get install -y --no-install-recommends xvfb
            cc -c -DGL45 -I include -I include/Pyros3D/Ext/gl45 \
              src/Pyros3D/Ext/gl45/glad.c -o /tmp/glad45.o
            c++ -std=c++17 -DGL45 -DCOMPUTE_SMOKE_GL \
              -I include -I include/Pyros3D/Ext/gl45 \
              $FT $(pkg-config --cflags sdl2) \
              tools/tests/compute_smoke.cpp /tmp/glad45.o \
              -o /tmp/compute_smoke \
              -L build -lPyrosEngine $(pkg-config --libs sdl2) \
              -Wl,-rpath,"$PWD/build"
            RUNNER="LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a"
          else
            # Headless: no SDL, no xvfb, no window. VMA and volk are
            # FetchContent'd, so their headers live in the build tree.
            VMA="$(find . -name vk_mem_alloc.h -print -quit)"
            VOLK="$(find . -name volk.h -print -quit)"
            c++ -std=c++17 -DVULKAN_BACKEND -DCOMPUTE_SMOKE_VULKAN \
              -I include -I "$VULKAN_SDK/include" $FT \
              -I "$(dirname "$VMA")" -I "$(dirname "$VOLK")" \
              tools/tests/compute_smoke.cpp -o /tmp/compute_smoke \
              -L build -lPyrosEngine -Wl,-rpath,"$PWD/build"
            RUNNER=""
          fi
          set +e
          env $RUNNER /tmp/compute_smoke | tee /tmp/compute_out.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "--- exit code $code ---"
          if [ $code -ne 0 ]; then
            echo "::error::compute_smoke failed on ${{ matrix.compute }}"
            exit 1
          fi
          # A SKIP exits 0 by design (so the test is safe to run anywhere),
          # but on THIS job a skip means llvmpipe did not give us GL 4.3+
          # and the coverage silently evaporated. Fail loudly instead.
          if grep -q '^SKIP' /tmp/compute_out.txt; then
            echo "::error::compute_smoke SKIPped on ${{ matrix.compute }} - the backend reported no compute support"
            exit 1
          fi
          grep -q '^PASS  compute_smoke' /tmp/compute_out.txt

      - name: Shader parity on GL compute
        if: matrix.compute == 'gl'
        # The only place the DDGI kernels' GLSL is RUN on OpenGL.
        #
        # Everything else that exercises compute for real - ddgi_gpu,
        # bvh_gpu, the particle parity - runs on macOS against Metal and
        # MoltenVK, because those are the only CI machines with a GPU.
        # That left GL 4.5 supported on the strength of "it compiles,
        # and compute_smoke dispatches a trivial kernel", while every
        # backend-specific bug this engine has had in compute was in the
        # real kernels: a SPIRV-Cross buffer-index swap, a barrier that
        # ordered without submitting, a bytes-per-row assert. None of
        # those would have been caught by a smoke test.
        #
        # These three are the cheap part of that coverage: two 64-thread
        # dispatches and one of 1024 rays, so llvmpipe finishes them in
        # seconds. Each reads the shipped GLSL, compiles it as compute
        # and compares against the C++ it is supposed to mirror - so
        # what they prove is that the shaders the renderer ships
        # compile and compute the same answers on GL. bvh_gpu covers
        # the BVH traversal kernel, which is the core of the tracing.
        #
        # ddgi_gpu is deliberately NOT here: 343 probes over several
        # multi-update sections is millions of rays through a software
        # rasteriser, and nobody has measured what that costs on
        # llvmpipe. It stays on macOS until someone does.
        #
        # A SKIP is a hard failure here for the same reason it is in the
        # step above: on this job it means the coverage evaporated.
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends xvfb
          FT="$(pkg-config --cflags freetype2)"
          SDLC="$(pkg-config --cflags sdl2)"
          SDLL="$(pkg-config --libs sdl2)"
          cc -c -DGL45 -I include -I include/Pyros3D/Ext/gl45 \
            src/Pyros3D/Ext/gl45/glad.c -o /tmp/glad45.o
          # bvh_gpu takes RTPARITY_GL rather than PARITY_GL - it
          # predates the other two and kept its own define prefix.
          for t in sh_shader_parity ddgi_specular_shader_parity bvh_gpu; do
            if [ "$t" = "bvh_gpu" ]; then DEF=-DRTPARITY_GL; else DEF=-DPARITY_GL; fi
            c++ -std=c++17 -O2 -DGL45 $DEF \
              -I include -I include/Pyros3D/Ext/gl45 $FT $SDLC \
              tools/tests/$t.cpp /tmp/glad45.o -o /tmp/$t \
              -L build -lPyrosEngine $SDLL -Wl,-rpath,"$PWD/build"
            # Run from the repo root - they read resources/shaders/.
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/$t | tee /tmp/$t.out
            if grep -q '^SKIP' /tmp/$t.out; then
              echo "::error::$t SKIPped - llvmpipe did not give us a GL 4.3+ compute context"
              exit 1
            fi
            grep -q "^PASS  $t" /tmp/$t.out
          done

      - name: Smoke run
        # A runner has no GPU and no display, so failing to open a window is
        # expected and fine. Death by signal is not - that is a broken package.
        # xvfb gives it a display to fail against for the right reasons.
        run: |
          apt-get install -y --no-install-recommends xvfb
          cd package/demolauncher
          set +e
          xvfb-run -a ./CppApiDemo > out.txt 2> err.txt &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 20s, which is the good outcome ---"
            kill $pid
            code=0
          else
            wait $pid
            code=$?
            echo "--- exited on its own with code $code ---"
          fi
          echo "--- stdout ---"; head -60 out.txt
          echo "--- stderr ---"; head -60 err.txt
          if [ $code -ge 128 ]; then
            echo "::error::CppApiDemo was killed by signal $((code - 128)) - the package is broken, not merely unable to render"
            exit 1
          fi
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
