name: Linux

# Every branch - see the note in macos.yml for why.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Built inside 22.04, not on the 24.04 runner, purely to lower the glibc
    # floor. glibc is forward- but not backward-compatible, so whatever the
    # build machine has becomes the minimum for everyone running the artifact,
    # and on 24.04 that was 2.38 - which locks out Ubuntu 22.04 LTS, Debian 12
    # and RHEL 9, all still widely deployed.
    #
    # Nothing in this engine needs a modern glibc. Measured against the 24.04
    # artifact, the entire 2.38 requirement came from __isoc23_sscanf /
    # __isoc23_strtol (glibc's own headers redirecting plain sscanf/strtol to
    # C23 variants) and a re-versioned fmodf. The floor was an accident of the
    # image, so the fix belongs here rather than in the code.
    #
    # 22.04 rather than something older: below glibc 2.28 the job cannot run at
    # all, because actions/checkout executes Node inside this container.
    container: ubuntu:22.04

    # A container job does not get the runner's default shell: GitHub falls
    # back to `sh -e {0}`, and dash is not bash. `set -o pipefail` is the first
    # thing that breaks on, after the build has already succeeded. Naming bash
    # once here is better than per-step, since every step below assumes it.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg. The OpenGL ones (GL 4.1, and the GL 4.5 one that ran the
          # compute parity tests on llvmpipe) went with the OpenGL renderer;
          # Vulkan is the only GPU API the renderer has on Linux. Kept as a
          # matrix so the job name and artifact name stay where they were.
          - name: Vulkan
            artifact: Pyros3D-linux-vulkan

    steps:
      # Before checkout, not after: actions/checkout needs git present to clone
      # submodules, and silently falls back to a submodule-less REST download
      # when it is missing - which then fails much later as a missing box2d.
      # A bare ubuntu image has neither git nor certificates.
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils sudo

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        # No sudo: a container job runs as root. It is installed above anyway,
        # because some actions expect it to exist.
        #
        # libcurl is not optional despite being "just" the AI Assistant's HTTP
        # transport: editor/CMakeLists.txt does find_package(CURL REQUIRED) and
        # fails configuration outright without it. macOS has it in /usr/lib and
        # Windows gets it from vcpkg, so Linux is the only platform that has to
        # ask - and the old workflow never noticed, because it never built the
        # editor at all.
        run: |
          apt-get install -y --no-install-recommends \
            build-essential ninja-build patchelf pkg-config file python3 \
            libsdl2-dev \
            libx11-dev \
            libfreetype-dev \
            liblua5.4-dev \
            libassimp-dev \
            libcurl4-openssl-dev
          # libx11-dev: the Vulkan device builds its surface against Xlib
          # (VK_USE_PLATFORM_XLIB_KHR in PyrosRenderer.cmake). libsdl2-dev
          # pulls it in today; named so that stays true if SDL's packaging
          # changes.

      - name: Install CMake
        # Jammy ships exactly 3.22.1 and the project asks for 3.22, which is a
        # hair's width to build on. Take the official binary release instead:
        # one URL, no third-party apt repo, same version the runner image would
        # have given us.
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local
          cmake --version

      - name: Install Vulkan headers
        # Jammy's libvulkan-dev is 1.3.204, and volk is pinned to
        # vulkan-sdk-1.4.357.0 in PyrosBackend.cmake. volk.c references entry
        # points declared in the headers of its own release, so headers older
        # than volk do not compile - the same coupling windows.yml calls out.
        #
        # Only the headers need to be current. The loader comes from apt and,
        # at runtime, from the user's system: volk dlopen()s it rather than
        # linking it, which is why the backend wants Vulkan::Headers and not
        # Vulkan::Vulkan.
        run: |
          apt-get install -y --no-install-recommends libvulkan-dev
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 \
            https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build \
            -DCMAKE_INSTALL_PREFIX=/opt/vulkan >/dev/null
          cmake --build /tmp/vulkan-headers/build --target install >/dev/null
          # FindVulkan looks under $VULKAN_SDK for include/ AND lib/, so point
          # lib/ at the loader apt just installed rather than leaving it empty.
          mkdir -p /opt/vulkan/lib
          ln -sf /usr/lib/x86_64-linux-gnu/libvulkan.so.1 /opt/vulkan/lib/libvulkan.so
          echo "VULKAN_SDK=/opt/vulkan" >> "$GITHUB_ENV"
          grep -m1 VK_HEADER_VERSION_COMPLETE /opt/vulkan/include/vulkan/vulkan_core.h

      - name: Cache the shader compiler
        id: spirv
        uses: actions/cache@v4
        with:
          path: /opt/spirv
          key: linux-jammy-shaderc-v2024.4-glslc-glslang-pic-1

      - name: Build the shader compiler (shaderc - glslc + glslang)
        if: steps.spirv.outputs.cache-hit != 'true'
        # glslc is a build-time requirement, not a runtime one:
        # PyrosRenderer.cmake compiles resources/shaders to SPIR-V when the
        # engine is built (find_program(glslc REQUIRED)) and embeds it, so
        # nothing compiles the renderer's shaders at run time and nothing
        # ships a shaders/ folder.
        #
        # From source rather than Jammy's glslc package so that the same build
        # also yields glslang - the optional runtime compiler for materials'
        # surfaces (PyrosRenderer.cmake: PYROS_GLSLANG_DIR) - as static,
        # position-independent archives that go INTO libPyrosEngine.so, with
        # the SPIRV-Tools optimizer glslang links against beside them. About
        # ten minutes on a cold cache; the cache above makes it once per
        # version. SPIRV-Cross is no longer built: only the Metal device uses
        # it.
        run: |
          git clone --depth 1 --branch v2024.4 https://github.com/google/shaderc.git /tmp/shaderc
          (cd /tmp/shaderc && python3 utils/git-sync-deps)
          cmake -S /tmp/shaderc -B /tmp/shaderc/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
            -DCMAKE_INSTALL_PREFIX=/opt/spirv >/dev/null
          cmake --build /tmp/shaderc/build --target install >/dev/null

      - name: Show the shader compiler
        # glslc must be there or the build cannot start. glslang is optional
        # for the engine, so a missing piece of it is a warning that the
        # build goes on without the runtime compiler, not a failure.
        #
        # glslang's static archives depend on each other and on SPIRV-Tools,
        # and PyrosRenderer.cmake only find_library()s the first of them
        # (RENDERER_GLSLANG_LIBRARY). Seeding that variable with the whole
        # set - as a STRING, so find_library leaves it alone, and inside a
        # link group so GNU ld's one-pass archive order does not matter -
        # makes it link without changing the engine's CMake.
        run: |
          echo /opt/spirv/bin >> "$GITHUB_PATH"
          /opt/spirv/bin/glslc --version | head -1
          ls /opt/spirv/lib
          libs="-Wl,--start-group"
          for l in glslang MachineIndependent GenericCodeGen OSDependent SPIRV SPIRV-Tools-opt SPIRV-Tools; do
            [ -f "/opt/spirv/lib/lib$l.a" ] && libs="$libs;/opt/spirv/lib/lib$l.a"
          done
          libs="$libs;-Wl,--end-group"
          if [ -f /opt/spirv/include/glslang/Include/glslang_c_interface.h ] \
             && [ -f /opt/spirv/lib/libglslang.a ] \
             && [ -f /opt/spirv/lib/libglslang-default-resource-limits.a ]; then
            echo "PYROS_GLSLANG_LIBS=$libs" >> "$GITHUB_ENV"
            echo "glslang: $libs"
          else
            echo "::warning::glslang was not installed by the shaderc build - the engine builds without the runtime GLSL compiler"
          fi

      - name: Configure
        # BUILD_EDITOR and BUILD_CONVERTER are new here. The old Build workflow
        # compiled the library and the demos only, so every editor-only source
        # file - which is most of what changes week to week - was unbuilt on
        # Linux entirely.
        #
        # PYROS_GRAPHICS=Vulkan is the default on Linux; it is spelled out so
        # the log says what was built. BUILD_VULKAN_BACKEND follows it
        # (PyrosOptions.cmake). HAVE_LUA_BINDINGS is on by default, which
        # DemoLauncher needs.
        run: |
          set -o pipefail
          glslang=()
          if [ -n "${PYROS_GLSLANG_LIBS:-}" ]; then
            glslang=(-DPYROS_GLSLANG_DIR=/opt/spirv "-DRENDERER_GLSLANG_LIBRARY:STRING=$PYROS_GLSLANG_LIBS")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYROS_GRAPHICS=Vulkan \
            -DSTATIC_LIB=OFF \
            "-DCMAKE_PREFIX_PATH=$VULKAN_SDK" \
            "${glslang[@]}" \
            -DBUILD_DEMOS=ON \
            -DBUILD_EDITOR=ON \
            -DBUILD_CONVERTER=ON \
            -DPYROS_RELOCATABLE_ASSETS=ON \
            -DLUA_INCLUDE_DIR=/usr/include/lua5.4 \
            -DLUA_LIBRARY=/usr/lib/x86_64-linux-gnu/liblua5.4.so | tee configure.log
          # Vulkan not found only WARNs, and the engine then configures with
          # no renderer at all. Fail here, where the cause is legible.
          grep -q "Renderer: on (Vulkan" configure.log || {
            echo "::error::the renderer is not on Vulkan - see the Renderer: line above"
            exit 1
          }
          grep "Renderer: on" configure.log

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: CPU tests
        # Everything in tools/tests that needs no GPU. They run HERE
        # rather than on macOS because this is the cheapest runner and
        # because none of them care what device the library was built
        # with. (The GPU parity tests that used to run on macOS and on the
        # GL 4.5 leg here went with the old renderer.)
        #
        # Built by hand, matching every other binary in tools/tests
        # (none are in the build system - see the compile line in each
        # file's header comment). Each returns non-zero on failure, so
        # `set -e` is the whole check.
        #
        # Until this step existed, eleven of these ran nowhere at all:
        # they were written, they passed on the author's machine, and
        # CI never saw them again.
        run: |
          set -euo pipefail
          FT="$(pkg-config --cflags freetype2)"
          # Split, and the order matters: GNU ld resolves left to
          # right, so a -l that appears BEFORE the object needing it
          # contributes nothing and the link fails on undefined
          # symbols. macOS's linker does not care, which is exactly how
          # a one-line build command that works on the author's machine
          # gets committed and breaks here.
          CF="-std=c++17 -O2 -I include $FT"
          LD="-L build -lPyrosEngine -Wl,-rpath,$PWD/build"

          # --- GI maths, CPU side -------------------------------------
          # The environment BRDF table, against the integral it
          # approximates and against the analytic fit it replaced.
          c++ $CF tools/tests/brdf_lut.cpp -o /tmp/brdf_lut $LD
          /tmp/brdf_lut
          # Specular GI: directionality, roughness response, and that a
          # reflection obeys the same wall a diffuse bounce does.
          c++ $CF tools/tests/ddgi_specular.cpp -o /tmp/ddgi_specular $LD
          /tmp/ddgi_specular

          # --- scene, tiles, UI ---------------------------------------
          c++ $CF tools/tests/child_registration.cpp -o /tmp/child_registration $LD
          /tmp/child_registration
          # Static objects must all be live after ONE update. They were
          # not: the loop that moves them off the pending list erased
          # and incremented, so it took three frames to register six
          # objects - invisible in a running scene, fatal to anything
          # that reads the scene once at load time.
          c++ $CF tools/tests/static_registration.cpp -o /tmp/static_registration $LD
          /tmp/static_registration
          # Moving geometry: that the triangles follow an object and
          # that the BVH follows the triangles. The second fails
          # silently - a stale tree still returns hits, just against
          # bounds nothing is inside any more.
          c++ $CF tools/tests/ray_scene_moving.cpp -o /tmp/ray_scene_moving $LD
          /tmp/ray_scene_moving
          c++ $CF tools/tests/tilemap_colliders.cpp -o /tmp/tilemap_colliders $LD
          /tmp/tilemap_colliders
          c++ $CF tools/tests/tilemap_mesh.cpp -o /tmp/tilemap_mesh $LD
          /tmp/tilemap_mesh
          c++ $CF tools/tests/tileset_uv.cpp -o /tmp/tileset_uv $LD
          /tmp/tileset_uv
          c++ $CF tools/tests/ui_layout.cpp -o /tmp/ui_layout $LD
          /tmp/ui_layout
          c++ $CF tools/tests/ui_widgets.cpp -o /tmp/ui_widgets $LD
          /tmp/ui_widgets

          # Box3D's own headers are not on the include path the engine
          # installs.
          c++ $CF -I src/Pyros3D/Ext/box3d/include \
            tools/tests/physics_unregistered_body.cpp -o /tmp/physics_unregistered_body $LD
          /tmp/physics_unregistered_body

          # --- streaming, terrain, foliage, networking ---------------
          # Background loading and world cells; heightfield tiles, their
          # LODs and collision; foliage scattering and density painting;
          # the brushes' image painting; the ENet transport and the
          # replication session (over loopback: real sockets, real
          # timing). PYROS_NETWORKING is the engine's PUBLIC define,
          # which a hand-built consumer has to repeat.
          for t in asset_streamer world_streamer heightfield foliage paintable_image net_transport net_session net_join net_rendezvous; do
            echo "--- $t ---"
            c++ $CF -DPYROS_NETWORKING -I src/Pyros3D/Ext/box3d/include \
              tools/tests/$t.cpp -o /tmp/$t $LD
            /tmp/$t
          done
          # The session's encryption: the cipher on its own (it lives in
          # src/, hence the include path) and a pinned server key.
          c++ $CF -DPYROS_NETWORKING -I src/Pyros3D/Network -I src/Pyros3D/Ext/box3d/include \
            tools/tests/net_crypto.cpp -o /tmp/net_crypto $LD
          /tmp/net_crypto

          # These two reach into shared/, which the editor and the
          # player both compile but the library does not export.
          c++ $CF -I shared tools/tests/prefab_roundtrip.cpp -o /tmp/prefab_roundtrip $LD
          # Wants a project-shaped directory to round-trip through, and
          # takes its root as an argument.
          mkdir -p /tmp/prefabproj/assets/prefabs /tmp/prefabproj/scenes
          (cd /tmp/prefabproj && /tmp/prefab_roundtrip .)

          # The same Lua the Configure step pointed CMake at - not
          # whatever `pkg-config lua` resolves to, which on this image
          # is a different major version and fails inside sol2 with a
          # wall of template errors.
          c++ $CF -DLUA_BINDINGS -I shared -I /usr/include/lua5.4 \
            tools/tests/ui_dispatch.cpp -o /tmp/ui_dispatch $LD -llua5.4
          /tmp/ui_dispatch
          # network.rpc / network.input from Lua, values intact.
          c++ $CF -DLUA_BINDINGS -DPYROS_NETWORKING -I /usr/include/lua5.4 -I src/Pyros3D/Ext/box3d/include \
            tools/tests/lua_network.cpp -o /tmp/lua_network $LD -llua5.4
          /tmp/lua_network

      - name: Package
        run: |
          set -euo pipefail
          out=package
          mkdir -p "$out/demolauncher" "$out/editor" "$out/lib"

          cp build/libPyrosEngine*.so* "$out/lib" 2>/dev/null || true

          # No shaders/ beside either executable any more: the renderer's
          # shaders are compiled to SPIR-V at build time and embedded in the
          # engine library.
          cp build/examples/DemoLauncher "$out/demolauncher"
          cp -R examples/assets          "$out/demolauncher/assets"

          cp build/editor/PyrosBuilder   "$out/editor"
          # The game runtime: what Build Game ships, here so a downloaded
          # editor can build a game at all - and so another platform's
          # editor can use this folder as its template for this one
          # (tools/fetch_templates.sh).
          mkdir -p "$out/player"
          cp build/player/PyrosPlayer build/player/PyrosServer "$out/player"
          cp build/libPyrosEngine*.so* "$out/player" 2>/dev/null || true
          cp build/editor/AssimpImporter "$out/editor"
          cp -R editor/assets            "$out/editor/assets"
          cp examples/assets/middleclass.lua "$out/editor/assets/"

          cp build/libPyrosEngine*.so* "$out/demolauncher" 2>/dev/null || true
          cp build/libPyrosEngine*.so* "$out/editor"       2>/dev/null || true

          cat > "$out/README.txt" <<'EOF'
          Pyros3D - Linux

            demolauncher/  DemoLauncher
            editor/        PyrosBuilder, AssimpImporter
            lib/           engine shared library

          Run each executable from inside its own folder - both resolve
          assets/ against the current directory:

              cd demolauncher
              ./DemoLauncher

          The bundled libraries (SDL2, freetype, lua, ...) sit next to the
          executables and are found through an $ORIGIN RUNPATH, so nothing
          needs installing for them. What is NOT bundled, deliberately, is
          anything tied to your machine: the Vulkan loader and driver, X11,
          and the C library. Those must come from your system, which means:

            - GLIBC_FLOOR_PLACEHOLDER
            - a working Vulkan driver and the Vulkan loader (libvulkan.so.1)
            - X11 client libraries (the window's Vulkan surface is Xlib's;
              under Wayland that means XWayland)

          Raise the log level with PYROS_LOG_LEVEL=3 for detail
          (0=errors, 1=+warnings, 2=+success, 3=everything).
          EOF

      - name: Bundle dependencies
        run: |
          chmod +x .github/scripts/bundle-linux.sh
          ./.github/scripts/bundle-linux.sh package/demolauncher package/editor package/player
          # The packaged runtime must start from its own folder, with only
          # what was bundled beside it: it is what Build Game copies into
          # every game, on this platform and - as a template - on others.
          # --print-key makes the server key and exits before any scene.
          mkdir -p /tmp/template-check/scenes
          echo '{"startupScene":"scenes/S.json"}' > /tmp/template-check/game.json
          package/player/PyrosServer --game /tmp/template-check --print-key
          test -s /tmp/template-check/server.key

      - name: Record the glibc floor
        # The minimum glibc is a measured property of the binaries, not a fact
        # about the build image, and the two are not the same: building in
        # 22.04 (glibc 2.35) produced binaries that only ever ask for 2.34,
        # because nothing here references a 2.35-only symbol. Writing the
        # measurement into the README keeps the claim true when the image, the
        # compiler or the dependency set changes - a hardcoded number silently
        # becomes a lie and turns away users who could have run it.
        run: |
          floor=$(find package -type f \( -perm -u+x -o -name '*.so*' \) -exec sh -c \
              'file -b "$1" | grep -q "^ELF" && readelf -V "$1" 2>/dev/null' _ {} \; \
              | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -u -V | tail -1)
          if [ -z "$floor" ]; then
            echo "::error::could not determine the glibc floor from the package"
            exit 1
          fi
          echo "measured glibc floor: $floor"
          sed -i "s/- GLIBC_FLOOR_PLACEHOLDER/- ${floor/GLIBC_/glibc } or newer (measured from the binaries)/" package/README.txt
          grep glibc package/README.txt

      - name: Smoke run
        # A runner has no GPU and no display. xvfb gives it a display, and
        # Mesa's lavapipe (mesa-vulkan-drivers) a software Vulkan device, so
        # the package gets a real chance to draw rather than only to fail -
        # the frame it captures (PYROS_SHOT, the 60th presented) is kept as
        # an artifact. Not a rendering test: a clean non-zero exit is still
        # an acceptable outcome. Death by signal is not - that is a broken
        # package.
        #
        # One exception to "signal = broken": when no device could be made
        # at all (lavapipe lacking something the device requires),
        # DemoLauncher::Init goes on to use the null device and crashes.
        # That is a defect in DemoLauncher, not in the package - it had
        # loaded every bundled library and opened its window to get that
        # far - so it is a warning rather than a failure.
        run: |
          apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
          shot="$PWD/smoke-shot.png"
          cd package/demolauncher
          set +e
          PYROS_DEMO_INDEX=0 PYROS_DEMO_NO_UI=1 PYROS_DEMO_FIXED_CLOCK=1 \
            PYROS_SHOT="$shot" PYROS_SHOT_FRAME=60 \
            xvfb-run -a ./DemoLauncher > out.txt 2> err.txt &
          pid=$!
          sleep 30
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 30s, which is the good outcome ---"
            kill $pid
            code=0
          else
            wait $pid
            code=$?
            echo "--- exited on its own with code $code ---"
          fi
          echo "--- stdout ---"; head -60 out.txt
          echo "--- stderr ---"; head -60 err.txt
          if [ -s "$shot" ]; then
            echo "--- frame captured: $(wc -c < "$shot") bytes ---"
          else
            echo "::warning::DemoLauncher wrote no PYROS_SHOT frame - no Vulkan device came up on lavapipe"
          fi
          if [ $code -ge 128 ]; then
            echo "::error::DemoLauncher was killed by signal $((code - 128)) - the package is broken, not merely unable to render"
            exit 1
          fi
          exit 0

      - name: Upload the smoke-run frame
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-smoke-frame
          path: smoke-shot.png
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
