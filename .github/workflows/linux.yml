name: Linux

# Every branch - see the note in macos.yml for why.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Built inside 22.04, not on the 24.04 runner, purely to lower the glibc
    # floor. glibc is forward- but not backward-compatible, so whatever the
    # build machine has becomes the minimum for everyone running the artifact,
    # and on 24.04 that was 2.38 - which locks out Ubuntu 22.04 LTS, Debian 12
    # and RHEL 9, all still widely deployed.
    #
    # Nothing in this engine needs a modern glibc. Measured against the 24.04
    # artifact, the entire 2.38 requirement came from __isoc23_sscanf /
    # __isoc23_strtol (glibc's own headers redirecting plain sscanf/strtol to
    # C23 variants) and a re-versioned fmodf. The floor was an accident of the
    # image, so the fix belongs here rather than in the code.
    #
    # 22.04 rather than something older: below glibc 2.28 the job cannot run at
    # all, because actions/checkout executes Node inside this container.
    container: ubuntu:22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenGL
            graphics: OpenGL
            context: SDL2
            vulkan: "OFF"
            artifact: Pyros3D-linux-opengl
          - name: Vulkan
            graphics: Vulkan
            context: SDL2Vulkan
            vulkan: "ON"
            artifact: Pyros3D-linux-vulkan

    steps:
      # Before checkout, not after: actions/checkout needs git present to clone
      # submodules, and silently falls back to a submodule-less REST download
      # when it is missing - which then fails much later as a missing box2d.
      # A bare ubuntu image has neither git nor certificates.
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl xz-utils sudo

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        # No sudo: a container job runs as root. It is installed above anyway,
        # because some actions expect it to exist.
        #
        # libcurl is not optional despite being "just" the AI Assistant's HTTP
        # transport: editor/CMakeLists.txt does find_package(CURL REQUIRED) and
        # fails configuration outright without it. macOS has it in /usr/lib and
        # Windows gets it from vcpkg, so Linux is the only platform that has to
        # ask - and the old workflow never noticed, because it never built the
        # editor at all.
        run: |
          apt-get install -y --no-install-recommends \
            build-essential ninja-build patchelf pkg-config file \
            libsdl2-dev \
            libfreetype-dev \
            liblua5.4-dev \
            libgl1-mesa-dev \
            libassimp-dev \
            libcurl4-openssl-dev

      - name: Install CMake
        # Jammy ships exactly 3.22.1 and the project asks for 3.22, which is a
        # hair's width to build on. Take the official binary release instead:
        # one URL, no third-party apt repo, same version the runner image would
        # have given us.
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local
          cmake --version

      - name: Install Vulkan headers
        if: matrix.vulkan == 'ON'
        # Jammy's libvulkan-dev is 1.3.204, and volk is pinned to
        # vulkan-sdk-1.4.357.0 in PyrosBackend.cmake. volk.c references entry
        # points declared in the headers of its own release, so headers older
        # than volk do not compile - the same coupling windows.yml calls out.
        #
        # Only the headers need to be current. The loader comes from apt and,
        # at runtime, from the user's system: volk dlopen()s it rather than
        # linking it, which is why the backend wants Vulkan::Headers and not
        # Vulkan::Vulkan.
        run: |
          apt-get install -y --no-install-recommends libvulkan-dev
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 \
            https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build \
            -DCMAKE_INSTALL_PREFIX=/opt/vulkan >/dev/null
          cmake --build /tmp/vulkan-headers/build --target install >/dev/null
          # FindVulkan looks under $VULKAN_SDK for include/ AND lib/, so point
          # lib/ at the loader apt just installed rather than leaving it empty.
          mkdir -p /opt/vulkan/lib
          ln -sf /usr/lib/x86_64-linux-gnu/libvulkan.so.1 /opt/vulkan/lib/libvulkan.so
          echo "VULKAN_SDK=/opt/vulkan" >> "$GITHUB_ENV"
          grep -m1 VK_HEADER_VERSION_COMPLETE /opt/vulkan/include/vulkan/vulkan_core.h

      - name: Configure
        # BUILD_EDITOR and BUILD_CONVERTER are new here. The old Build workflow
        # compiled the library and the demos only, so every editor-only source
        # file - which is most of what changes week to week - was unbuilt on
        # Linux entirely.
        #
        # BUILD_SPIRV_TOOLING=OFF: Ubuntu's shaderc/spirv-cross packaging is
        # the one combination PyrosBackend.cmake warns about (a thin
        # libshaderc_combined.a that still needs glslang at link time), and it
        # degrades to a warning rather than an error, which would leave a
        # silently tool-less build here. Windows and macOS both cover it.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPYROS_GRAPHICS=${{ matrix.graphics }} \
            -DCONTEXT=${{ matrix.context }} \
            -DOPENGL_VERSION=GL41 \
            -DSTATIC_LIB=OFF \
            -DBUILD_VULKAN_BACKEND=${{ matrix.vulkan }} \
            ${VULKAN_SDK:+-DCMAKE_PREFIX_PATH=$VULKAN_SDK} \
            -DBUILD_SPIRV_TOOLING=OFF \
            -DBUILD_DEMOS=ON \
            -DBUILD_EDITOR=ON \
            -DBUILD_CONVERTER=ON \
            -DPYROS_RELOCATABLE_ASSETS=ON \
            -DLUA_INCLUDE_DIR=/usr/include/lua5.4 \
            -DLUA_LIBRARY=/usr/lib/x86_64-linux-gnu/liblua5.4.so

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package
        run: |
          set -euo pipefail
          out=package
          mkdir -p "$out/demolauncher" "$out/editor" "$out/lib"

          cp build/libPyrosEngine*.so* "$out/lib" 2>/dev/null || true

          cp build/examples/DemoLauncher "$out/demolauncher"
          cp build/examples/CppApiDemo   "$out/demolauncher"
          cp -R examples/assets          "$out/demolauncher/assets"
          cp -R resources/shaders        "$out/demolauncher/shaders"

          cp build/editor/PyrosBuilder   "$out/editor"
          cp build/editor/AssimpImporter "$out/editor"
          cp -R editor/assets            "$out/editor/assets"
          cp -R resources/shaders        "$out/editor/shaders"
          cp examples/assets/middleclass.lua "$out/editor/assets/"

          cp build/libPyrosEngine*.so* "$out/demolauncher" 2>/dev/null || true
          cp build/libPyrosEngine*.so* "$out/editor"       2>/dev/null || true

          cat > "$out/README.txt" <<'EOF'
          Pyros3D - Linux

            demolauncher/  DemoLauncher, CppApiDemo
            editor/        PyrosBuilder, AssimpImporter
            lib/           engine shared library

          Run each executable from inside its own folder - both resolve
          assets/ and shaders/ against the current directory:

              cd demolauncher
              ./DemoLauncher

          The bundled libraries (SDL2, freetype, lua, ...) sit next to the
          executables and are found through an $ORIGIN RUNPATH, so nothing
          needs installing for them. What is NOT bundled, deliberately, is
          anything tied to your machine: the GL/Vulkan driver, X11/Wayland,
          and the C library. Those must come from your system, which means:

            - glibc 2.35 or newer (built on Ubuntu 22.04)
            - a working OpenGL or Vulkan driver
            - X11 or Wayland client libraries

          Raise the log level with PYROS_LOG_LEVEL=3 for detail
          (0=errors, 1=+warnings, 2=+success, 3=everything).
          EOF

      - name: Bundle dependencies
        run: |
          chmod +x .github/scripts/bundle-linux.sh
          ./.github/scripts/bundle-linux.sh package/demolauncher package/editor

      - name: Smoke run
        # A runner has no GPU and no display, so failing to open a window is
        # expected and fine. Death by signal is not - that is a broken package.
        # xvfb gives it a display to fail against for the right reasons.
        run: |
          apt-get install -y --no-install-recommends xvfb
          cd package/demolauncher
          set +e
          xvfb-run -a ./CppApiDemo > out.txt 2> err.txt &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then
            echo "--- still running after 20s, which is the good outcome ---"
            kill $pid
            code=0
          else
            wait $pid
            code=$?
            echo "--- exited on its own with code $code ---"
          fi
          echo "--- stdout ---"; head -60 out.txt
          echo "--- stderr ---"; head -60 err.txt
          if [ $code -ge 128 ]; then
            echo "::error::CppApiDemo was killed by signal $((code - 128)) - the package is broken, not merely unable to render"
            exit 1
          fi
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error
